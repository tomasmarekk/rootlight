[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
rootlight-agent = { path = "../crates/rootlight-agent" }
rootlight-mcp-contract = { path = "../crates/rootlight-mcp-contract" }
