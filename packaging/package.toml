# Canonical package inventory for deterministic per-user distributions.
# Every installed path is relative to an installer-selected root, while
# platform autostart resources remain disabled unless the user opts in.

schema = "rootlight.package-spec/2"
autostart_default = "disabled"
user_data_policy = "preserve"
ownership_manifest = "state/install-manifest.json"
active_version_file = "state/active-version"
launcher_binary = "rootlight-launcher"
mcp_launcher_binary = "rootlight-mcp-launcher"
versions_directory = "versions"
launcher_directory = "current/bin"
update_lock_file = "state/update.lock"
update_transaction_file = "state/update-transaction.json"
retained_versions = 2
maximum_binary_bytes = 536870912

[[binaries]]
name = "rootlight"
unix_mode = 493

[[binaries]]
name = "rootlight-adapter-host"
unix_mode = 493

[[binaries]]
name = "rootlight-daemon"
unix_mode = 493

[[binaries]]
name = "rootlight-mcp"
unix_mode = 493

[[binaries]]
name = "rootlight-semantic-host"
unix_mode = 493

[[binaries]]
name = "rootlight-web"
unix_mode = 493

[[asset_trees]]
name = "rootlight-web-ui"
destination = "share/rootlight/web"
manifest = "asset-manifest.json"
maximum_files = 1025
maximum_total_bytes = 68157440
maximum_file_bytes = 16777216

[[generated_notices]]
name = "rootlight-web-third-party"
destination = "licenses/rootlight-web-third-party-notices.txt"
maximum_bytes = 8388608

[[platforms]]
target = "aarch64-apple-darwin"
executable_suffix = ""
autostart_kind = "launchd_user_agent"
autostart_resource = "com.rootlight.daemon"
autostart_source = "packaging/autostart/macos/com.rootlight.daemon.plist"

[[platforms]]
target = "aarch64-unknown-linux-gnu"
executable_suffix = ""
autostart_kind = "systemd_user_unit"
autostart_resource = "rootlight-daemon.service"
autostart_source = "packaging/autostart/linux/rootlight-daemon.service"

[[platforms]]
target = "x86_64-apple-darwin"
executable_suffix = ""
autostart_kind = "launchd_user_agent"
autostart_resource = "com.rootlight.daemon"
autostart_source = "packaging/autostart/macos/com.rootlight.daemon.plist"

[[platforms]]
target = "x86_64-pc-windows-msvc"
executable_suffix = ".exe"
autostart_kind = "windows_scheduled_task"
autostart_resource = "RootlightDaemon"
autostart_source = "packaging/autostart/windows/rootlight-daemon.xml"

[[platforms]]
target = "x86_64-unknown-linux-gnu"
executable_suffix = ""
autostart_kind = "systemd_user_unit"
autostart_resource = "rootlight-daemon.service"
autostart_source = "packaging/autostart/linux/rootlight-daemon.service"
