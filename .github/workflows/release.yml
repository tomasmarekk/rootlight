name: release authorization

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-authorization-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  authorize:
    name: require complete candidate evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Require production readiness
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          cargo run --locked --quiet --package xtask -- release-readiness \
            --output artifacts/release-authorization.json \
            --source-revision "$SOURCE_REVISION" \
            --require-ready
      - name: Upload authorization evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootlight-release-authorization-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-authorization.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false
