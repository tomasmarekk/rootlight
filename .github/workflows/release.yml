name: release
run-name: release / ${{ inputs.channel }} / ${{ inputs.exact_final_version || 'automatic' }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Alpha increments alpha.N; final promotes the active alpha or advances minor
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - final
      exact_final_version:
        description: Optional explicit final SemVer, for example 0.130.0
        required: false
        type: string
      notes_mode:
        description: Empty notes, a bounded commit summary, or exact custom notes
        required: true
        default: none
        type: choice
        options:
          - none
          - commits
          - custom
      commit_count:
        description: Commit subjects to include when notes mode is commits
        required: true
        default: 30
        type: number
      release_notes:
        description: Exact Markdown used only when notes mode is custom
        required: false
        type: string
      rollout_percentage:
        description: Percentage of opted-in installations eligible for this update
        required: true
        default: 100
        type: number
permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  prepare:
    name: prepare exact native release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      candidate_run_attempt: ${{ steps.gates.outputs.candidate_run_attempt }}
      candidate_run_id: ${{ steps.gates.outputs.candidate_run_id }}
      npm_tag: ${{ steps.plan.outputs.npm_tag }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Resolve the next immutable release identity
        id: plan
        env:
          CHANNEL: ${{ inputs.channel }}
          EXACT_VERSION: ${{ inputs.exact_final_version }}
        run: |
          mkdir -p artifacts/release-plan
          git tag --list 'v*' | LC_ALL=C sort \
            > artifacts/release-plan/tags.txt
          arguments=(
            --channel "$CHANNEL"
            --tags artifacts/release-plan/tags.txt
            --output artifacts/release-plan/plan.json
          )
          if [[ -n "$EXACT_VERSION" ]]; then
            arguments+=(--exact-version "$EXACT_VERSION")
          fi
          cargo run --locked --quiet --package xtask -- release-plan "${arguments[@]}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("artifacts/release-plan/plan.json").read_bytes())
          if set(plan) != {"npm_tag", "prerelease", "tag", "version"}:
              raise SystemExit("release plan has an unexpected shape")
          values = {
              "npm_tag": plan["npm_tag"],
              "prerelease": str(plan["prerelease"]).lower(),
              "tag": plan["tag"],
              "version": plan["version"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, value in values.items():
                  if "\n" in value or "\r" in value:
                      raise SystemExit("release plan output contains a line break")
                  output.write(f"{name}={value}\n")
          PY
      - name: Run exact exhaustive CI and candidate gates
        id: gates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.plan.outputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          arguments=(
            --source-revision "$SOURCE_REVISION"
            --release-version "$RELEASE_VERSION"
            --request-id "release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            --output artifacts/release-plan/gates.json
          )
          python scripts/orchestrate_release.py "${arguments[@]}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          gates = json.loads(Path("artifacts/release-plan/gates.json").read_bytes())
          expected = {
              "candidate_run_attempt",
              "candidate_run_id",
              "ci_run_attempt",
              "ci_run_id",
          }
          if set(gates) != expected or any(
              not isinstance(value, int) or isinstance(value, bool) or value < 1
              for value in gates.values()
          ):
              raise SystemExit("release gate output has an unexpected shape")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, value in sorted(gates.items()):
                  output.write(f"{name}={value}\n")
          PY
      - name: Download exact native candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rootlight-release-candidate-*-${{ github.sha }}-${{ steps.gates.outputs.candidate_run_id }}-${{ steps.gates.outputs.candidate_run_attempt }}
          path: artifacts/release-candidates
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.gates.outputs.candidate_run_id }}
      - name: Download signature and attestation bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootlight-release-trust-${{ github.sha }}-${{ steps.gates.outputs.candidate_run_id }}-${{ steps.gates.outputs.candidate_run_attempt }}
          path: artifacts/release-trust
          github-token: ${{ github.token }}
          run-id: ${{ steps.gates.outputs.candidate_run_id }}
      - name: Download target-specific SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootlight-release-sbom-${{ github.sha }}-${{ steps.gates.outputs.candidate_run_id }}-${{ steps.gates.outputs.candidate_run_attempt }}
          path: artifacts/release-sbom
          github-token: ${{ github.token }}
          run-id: ${{ steps.gates.outputs.candidate_run_id }}
      - name: Download exact release-performance audit inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rootlight-release-performance-*-${{ github.sha }}-${{ steps.gates.outputs.candidate_run_id }}-${{ steps.gates.outputs.candidate_run_attempt }}
          path: artifacts/release-performance
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ steps.gates.outputs.candidate_run_id }}
      - name: Download exact Windows unsafe audit input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootlight-unsafe-windows-${{ github.sha }}-${{ steps.gates.outputs.candidate_run_id }}-${{ steps.gates.outputs.candidate_run_attempt }}
          path: artifacts/release-unsafe-windows
          github-token: ${{ github.token }}
          run-id: ${{ steps.gates.outputs.candidate_run_id }}
      - name: Verify exact candidates and source binding
        env:
          SOURCE_REVISION: ${{ github.sha }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          version="$VERSION"
          for target in \
            aarch64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc \
            x86_64-unknown-linux-gnu; do
            archive="artifacts/release-candidates/rootlight-$version-$target.zip"
            cargo run --locked --quiet --package xtask -- package-verify \
              --archive "$archive"
            python scripts/validate-package-lifecycle.py \
              --path "artifacts/release-candidates/$target.lifecycle.json" \
              --target "$target" \
              --candidate-version "$version" \
              --source-revision "$SOURCE_REVISION" \
              --candidate-archive "$(basename "$archive")" \
              --candidate-sha256 "$(cut -d ' ' -f 1 "$archive.sha256")"
            test -f "artifacts/release-candidates/$target.candidate.json"
            test -f "artifacts/release-candidates/$target.web-smoke.json"
            find artifacts/release-trust \
              -type f -name "rootlight-$version-$target.zip.sigstore.json" \
              -print -quit | grep --quiet .
          done
          VERSION="$version" python - <<'PY'
          import json
          import hashlib
          import os
          from pathlib import Path

          root = Path("artifacts/release-candidates")
          for target in (
              "aarch64-apple-darwin",
              "aarch64-unknown-linux-gnu",
              "x86_64-apple-darwin",
              "x86_64-pc-windows-msvc",
              "x86_64-unknown-linux-gnu",
          ):
              record = json.loads((root / f"{target}.candidate.json").read_bytes())
              expected = {
                  "lifecycle_report": f"{target}.lifecycle.json",
                  "schema": "rootlight.release-package-candidate/2",
                  "source_revision": os.environ["SOURCE_REVISION"],
                  "target": target,
                  "version": os.environ["VERSION"],
                  "web_node_version": "24.11.1",
                  "web_npm_version": "11.6.2",
                  "web_smoke_report": f"{target}.web-smoke.json",
              }
              if {key: record.get(key) for key in expected} != expected:
                  raise SystemExit(f"candidate record differs for {target}: {record!r}")
              lifecycle_path = root / f"{target}.lifecycle.json"
              lifecycle_bytes = lifecycle_path.read_bytes()
              if (
                  record.get("lifecycle_sha256")
                  != hashlib.sha256(lifecycle_bytes).hexdigest()
              ):
                  raise SystemExit(f"candidate lifecycle digest differs for {target}")
              archive = f"rootlight-{os.environ['VERSION']}-{target}.zip"
              archive_sha256 = (
                  root / f"{archive}.sha256"
              ).read_text(encoding="utf-8").split("  ", 1)[0]
              lifecycle = json.loads(lifecycle_bytes)
              lifecycle_expected = {
                  "baseline_archive": f"rootlight-0.0.0-{target}.zip",
                  "baseline_version": "0.0.0",
                  "candidate_archive": archive,
                  "candidate_sha256": archive_sha256,
                  "candidate_target": target,
                  "candidate_version": os.environ["VERSION"],
                  "committed_active_version": os.environ["VERSION"],
                  "committed_last_good_version": "0.0.0",
                  "rollback_active_version": "0.0.0",
                  "schema": "rootlight.package-lifecycle/5",
                  "source_revision": os.environ["SOURCE_REVISION"],
              }
              if {
                  key: lifecycle.get(key) for key in lifecycle_expected
              } != lifecycle_expected:
                  raise SystemExit(f"candidate lifecycle differs for {target}: {lifecycle!r}")
              observations = (
                  "candidate_health_observed",
                  "clean_recovery_observed",
                  "failed_health_rollback_observed",
                  "launcher_probe_observed",
                  "unowned_data_preserved",
                  "user_data_preserved",
                  "web_payload_owned",
                  "web_payload_rollback_observed",
                  "web_payload_uninstall_observed",
                  "web_payload_version_bound",
              )
              if any(lifecycle.get(field) is not True for field in observations):
                  raise SystemExit(f"candidate lifecycle is incomplete for {target}")
              if lifecycle.get("bootstrap_owned_files", 0) < 1:
                  raise SystemExit(f"candidate bootstrap owned no files for {target}")
              if lifecycle.get("uninstall_removed_versions") != 2:
                  raise SystemExit(f"candidate uninstall differs for {target}")
              web_smoke_path = root / f"{target}.web-smoke.json"
              web_smoke_bytes = web_smoke_path.read_bytes()
              if (
                  record.get("web_smoke_sha256")
                  != hashlib.sha256(web_smoke_bytes).hexdigest()
              ):
                  raise SystemExit(f"candidate web smoke digest differs for {target}")
              web_smoke = json.loads(web_smoke_bytes)
              if (
                  web_smoke.get("schema") != "rootlight.installed-web-smoke/3"
                  or web_smoke.get("candidate_version") != os.environ["VERSION"]
                  or web_smoke.get("target") != target
                  or web_smoke.get("node_runtime_required") is not False
              ):
                  raise SystemExit(f"candidate web smoke differs for {target}")
          if not any(Path("artifacts/release-sbom").rglob("*.cdx.json")):
              raise SystemExit("release SBOM set is empty")
          performance = Path("artifacts/release-performance")
          expected_performance = {
              "aarch64-apple-darwin",
              "aarch64-unknown-linux-gnu",
              "x86_64-apple-darwin",
              "x86_64-pc-windows-msvc",
              "x86_64-unknown-linux-gnu",
          }
          observed_performance = {
              path.stem for path in performance.glob("*.json")
          }
          if observed_performance != expected_performance:
              raise SystemExit(
                  f"release performance audit set differs: {observed_performance!r}"
              )
          unsafe = Path("artifacts/release-unsafe-windows")
          if not any(path.is_file() for path in unsafe.rglob("*")):
              raise SystemExit("Windows unsafe audit input is empty")
          PY
      - name: Create exact unsigned update metadata
        id: update_metadata
        shell: bash
        env:
          EXPIRES_AFTER_SECONDS: "15552000"
          ROOTLIGHT_UPDATE_KEY_ID: ${{ vars.ROOTLIGHT_UPDATE_KEY_ID }}
          ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          test "$ROOTLIGHT_UPDATE_KEY_ID" != ""
          [[ "$ROLLOUT_PERCENTAGE" =~ ^[0-9]+$ ]]
          test "$ROLLOUT_PERCENTAGE" -ge 1
          test "$ROLLOUT_PERCENTAGE" -le 100
          mapfile -t provenance_bundles < <(
            find artifacts/release-trust \
              -type f \
              -name slsa-provenance.sigstore.json \
              -print
          )
          test "${#provenance_bundles[@]}" -eq 1
          umask 077
          valid_from="$(date +%s)"
          expires="$((valid_from + EXPIRES_AFTER_SECONDS))"
          version="$VERSION"
          for target in \
            aarch64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc \
            x86_64-unknown-linux-gnu; do
            archive="artifacts/release-candidates/rootlight-$version-$target.zip"
            output="artifacts/update-release/$target"
            mkdir -p "$output"
            ARCHIVE="$archive" OUTPUT="$output/licenses.zip" python - <<'PY'
          import os
          from pathlib import Path
          import zipfile

          source_path = Path(os.environ["ARCHIVE"])
          output_path = Path(os.environ["OUTPUT"])
          with zipfile.ZipFile(source_path) as source:
              names = sorted(
                  name
                  for name in source.namelist()
                  if name in {"LICENSE", "NOTICE"} or name.startswith("licenses/")
              )
              if len(names) < 3:
                  raise SystemExit("candidate license and notice inventory is incomplete")
              with zipfile.ZipFile(
                  output_path, "x", compression=zipfile.ZIP_STORED
              ) as bundle:
                  for name in names:
                      info = zipfile.ZipInfo(name, date_time=(1980, 1, 1, 0, 0, 0))
                      info.compress_type = zipfile.ZIP_STORED
                      info.create_system = 3
                      info.external_attr = 0o100644 << 16
                      bundle.writestr(info, source.read(name))
          PY
            cargo run --locked --quiet --package xtask -- update-release-metadata \
              --archive "$archive" \
              --sbom "artifacts/release-sbom/$target/rootlight-distribution.cdx.json" \
              --provenance "${provenance_bundles[0]}" \
              --license-bundle "$output/licenses.zip" \
              --target "$target" \
              --version "$version" \
              --key-id "$ROOTLIGHT_UPDATE_KEY_ID" \
              --valid-from "$valid_from" \
              --expires "$expires" \
              --rollout-percentage "$ROLLOUT_PERCENTAGE" \
              --catalog-schema 3 \
              --protocol-major 1 \
              --protocol-minor 8 \
              --output-dir "$output"
          done
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          test "$(
            find artifacts/update-release -type f | wc -l
          )" -eq 10
      - name: Upload exact unsigned update inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootlight-update-release-unsigned-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/update-release
          if-no-files-found: error
          retention-days: 1

  sign-update-metadata:
    name: sign update metadata and artifacts with protected identity
    needs: prepare
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    environment: release-signing
    permissions:
      actions: read
      contents: none
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download unsigned update inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootlight-update-release-unsigned-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/update-release
      - name: Sign exact metadata and artifact identities outside repository-built code
        shell: bash
        env:
          ROOTLIGHT_UPDATE_KEY_ID: ${{ vars.ROOTLIGHT_UPDATE_KEY_ID }}
          ROOTLIGHT_UPDATE_PUBLIC_KEY_HEX: ${{ vars.ROOTLIGHT_UPDATE_PUBLIC_KEY_HEX }}
          ROOTLIGHT_UPDATE_SIGNER_AUDIENCE: ${{ vars.ROOTLIGHT_UPDATE_SIGNER_AUDIENCE }}
          ROOTLIGHT_UPDATE_SIGNER_URL: ${{ vars.ROOTLIGHT_UPDATE_SIGNER_URL }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          [[ "$ROOTLIGHT_UPDATE_KEY_ID" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]]
          [[ "$ROOTLIGHT_UPDATE_PUBLIC_KEY_HEX" =~ ^[0-9a-f]{64}$ ]]
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          test "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" != ""
          test "$ACTIONS_ID_TOKEN_REQUEST_URL" != ""
          SIGNER_AUDIENCE="$ROOTLIGHT_UPDATE_SIGNER_AUDIENCE" \
            SIGNER_URL="$ROOTLIGHT_UPDATE_SIGNER_URL" \
            python - <<'PY'
          import os
          from urllib.parse import urlsplit

          audience = os.environ["SIGNER_AUDIENCE"]
          signer_url = os.environ["SIGNER_URL"]
          try:
              audience_bytes = audience.encode("ascii")
              signer_url_bytes = signer_url.encode("ascii")
          except UnicodeEncodeError as error:
              raise SystemExit("protected signer configuration must be ASCII") from error
          if not 1 <= len(audience_bytes) <= 512 or any(
              byte < 0x21 or byte == 0x7F for byte in audience_bytes
          ):
              raise SystemExit("protected signer audience is invalid")
          if not 1 <= len(signer_url_bytes) <= 2048 or any(
              byte < 0x21 or byte == 0x7F for byte in signer_url_bytes
          ):
              raise SystemExit("protected signer URL is invalid")
          try:
              parsed = urlsplit(signer_url)
              parsed_port = parsed.port
          except ValueError as error:
              raise SystemExit("protected signer URL is invalid") from error
          if (
              parsed.scheme != "https"
              or parsed.hostname is None
              or parsed.username is not None
              or parsed.password is not None
              or parsed.query
              or parsed.fragment
              or parsed_port == 0
          ):
              raise SystemExit("protected signer URL must be an HTTPS endpoint")
          PY

          oidc_response="$(
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              --get \
              --data-urlencode "audience=$ROOTLIGHT_UPDATE_SIGNER_AUDIENCE" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL"
          )"
          oidc_token="$(
            OIDC_RESPONSE="$oidc_response" python - <<'PY'
          import json
          import os
          import re

          response = json.loads(os.environ["OIDC_RESPONSE"])
          if set(response) != {"value"} or not isinstance(response["value"], str):
              raise SystemExit("GitHub OIDC response has an unexpected shape")
          if re.fullmatch(
              r"[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+",
              response["value"],
          ) is None:
              raise SystemExit("GitHub OIDC response is not a canonical JWT")
          print(response["value"], end="")
          PY
          )"
          unset oidc_response
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL

          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          printf '302a300506032b6570032100%s' "$ROOTLIGHT_UPDATE_PUBLIC_KEY_HEX" |
            xxd -r -p > "$temporary/public-key.der"
          openssl pkey \
            -pubin \
            -inform DER \
            -in "$temporary/public-key.der" \
            -out "$temporary/public-key.pem"

          sign_payload() {
            local payload="$1"
            local signature="$2"
            local payload_sha256
            local response="$temporary/response.json"
            local signature_binary="$temporary/signature.bin"
            local signature_schema="rootlight.protected-signature/1"
            payload_sha256="$(sha256sum "$payload" | cut -d ' ' -f 1)"
            curl --fail-with-body --silent --show-error \
              --connect-timeout 10 \
              --max-time 30 \
              --request POST \
              --header "Authorization: Bearer $oidc_token" \
              --header "Content-Type: application/octet-stream" \
              --header "X-Rootlight-Signature-Schema: $signature_schema" \
              --header "X-Rootlight-Source-Revision: $SOURCE_REVISION" \
              --header "X-Rootlight-Key-Id: $ROOTLIGHT_UPDATE_KEY_ID" \
              --header "X-Rootlight-Public-Key-Hex: $ROOTLIGHT_UPDATE_PUBLIC_KEY_HEX" \
              --header "X-Rootlight-Payload-Sha256: $payload_sha256" \
              --data-binary "@$payload" \
              --output "$response" \
              "$ROOTLIGHT_UPDATE_SIGNER_URL"
            PAYLOAD="$payload" \
              PAYLOAD_SHA256="$payload_sha256" \
              RESPONSE="$response" \
              ROOTLIGHT_UPDATE_KEY_ID="$ROOTLIGHT_UPDATE_KEY_ID" \
              ROOTLIGHT_UPDATE_PUBLIC_KEY_HEX="$ROOTLIGHT_UPDATE_PUBLIC_KEY_HEX" \
              SIGNATURE="$signature" \
              SIGNATURE_SCHEMA="$signature_schema" \
              SOURCE_REVISION="$SOURCE_REVISION" \
              python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          payload = Path(os.environ["PAYLOAD"]).read_bytes()
          if hashlib.sha256(payload).hexdigest() != os.environ["PAYLOAD_SHA256"]:
              raise SystemExit("payload changed across the protected signing request")
          response_bytes = Path(os.environ["RESPONSE"]).read_bytes()
          if not 1 <= len(response_bytes) <= 4096:
              raise SystemExit("protected signer response exceeds its bound")

          def exact_object(pairs: list[tuple[str, object]]) -> dict[str, object]:
              response_object: dict[str, object] = {}
              for key, value in pairs:
                  if key in response_object:
                      raise ValueError("duplicate protected signer response field")
                  response_object[key] = value
              return response_object

          try:
              response = json.loads(response_bytes, object_pairs_hook=exact_object)
          except (UnicodeDecodeError, ValueError, json.JSONDecodeError) as error:
              raise SystemExit("protected signer response is invalid JSON") from error
          expected = {
              "key_id": os.environ["ROOTLIGHT_UPDATE_KEY_ID"],
              "payload_sha256": os.environ["PAYLOAD_SHA256"],
              "public_key_hex": os.environ["ROOTLIGHT_UPDATE_PUBLIC_KEY_HEX"],
              "schema": os.environ["SIGNATURE_SCHEMA"],
              "source_revision": os.environ["SOURCE_REVISION"],
          }
          if not isinstance(response, dict) or set(response) != {
              *expected,
              "signature_hex",
          }:
              raise SystemExit("protected signer response has an unexpected shape")
          if {key: response.get(key) for key in expected} != expected:
              raise SystemExit("protected signer identity or payload binding differs")
          signature = response["signature_hex"]
          if (
              not isinstance(signature, str)
              or len(signature) != 128
              or any(character not in "0123456789abcdef" for character in signature)
          ):
              raise SystemExit("protected signer returned a non-canonical signature")
          Path(os.environ["SIGNATURE"]).write_text(
              f"{signature}\n", encoding="ascii", newline="\n"
          )
          PY
            xxd -r -p < "$signature" > "$signature_binary"
            test "$(wc -c < "$signature_binary")" -eq 64
            openssl pkeyutl \
              -verify \
              -pubin \
              -inkey "$temporary/public-key.pem" \
              -rawin \
              -in "$payload" \
              -sigfile "$signature_binary"
          }

          mapfile -d '' metadata_files < <(
            find artifacts/update-release \
              -type f \
              -name '*.update.json' \
              -print0 |
              sort --zero-terminated
          )
          test "${#metadata_files[@]}" -eq 5
          for metadata in "${metadata_files[@]}"; do
            signature="${metadata%.json}.sig"
            sign_payload "$metadata" "$signature"
            artifact_message="$temporary/artifact-message.bin"
            METADATA="$metadata" ARTIFACT_MESSAGE="$artifact_message" python - <<'PY'
          import json
          import os
          from pathlib import Path

          metadata = json.loads(Path(os.environ["METADATA"]).read_bytes())
          artifact = metadata.get("artifact", {})
          digest = artifact.get("sha256")
          size = artifact.get("size_bytes")
          if (
              not isinstance(digest, str)
              or len(digest) != 64
              or any(character not in "0123456789abcdef" for character in digest)
              or not isinstance(size, int)
              or isinstance(size, bool)
              or not 0 < size <= 2 * 1024 * 1024 * 1024
          ):
              raise SystemExit("signed metadata has an invalid artifact identity")
          message = (
              b"rootlight.release-artifact-signature/1\0"
              + bytes.fromhex(digest)
              + size.to_bytes(8, "big")
          )
          Path(os.environ["ARTIFACT_MESSAGE"]).write_bytes(message)
          PY
            artifact_signature="${metadata%.update.json}.artifact.sig"
            sign_payload "$artifact_message" "$artifact_signature"
          done
          unset oidc_token
          printf '%s\n' "$ROOTLIGHT_UPDATE_PUBLIC_KEY_HEX" \
            > artifacts/update-release/rootlight-update-public-key.txt
          test "$(
            find artifacts/update-release -type f | wc -l
          )" -eq 21
      - name: Upload signed update release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootlight-update-release-signed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/update-release
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish signed native and npm release
    needs: [prepare, sign-update-metadata]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.1
          package-manager-cache: false
      - name: Download exact native candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rootlight-release-candidate-*-${{ github.sha }}-${{ needs.prepare.outputs.candidate_run_id }}-${{ needs.prepare.outputs.candidate_run_attempt }}
          path: artifacts/release-candidates
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.candidate_run_id }}
      - name: Download signature and attestation bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootlight-release-trust-${{ github.sha }}-${{ needs.prepare.outputs.candidate_run_id }}-${{ needs.prepare.outputs.candidate_run_attempt }}
          path: artifacts/release-trust
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.candidate_run_id }}
      - name: Download target-specific SBOMs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootlight-release-sbom-${{ github.sha }}-${{ needs.prepare.outputs.candidate_run_id }}-${{ needs.prepare.outputs.candidate_run_attempt }}
          path: artifacts/release-sbom
          github-token: ${{ github.token }}
          run-id: ${{ needs.prepare.outputs.candidate_run_id }}
      - name: Download protected update signatures
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootlight-update-release-signed-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/update-release
      - name: Publish exact native packages through npm trusted publishing
        env:
          NPM_TAG: ${{ needs.prepare.outputs.npm_tag }}
          SOURCE_REVISION: ${{ github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python scripts/prepare_npm_packages.py release \
            --candidates-dir artifacts/release-candidates \
            --version "$VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --output-dir artifacts/npm-packages
          python scripts/publish_npm_packages.py \
            --packages-dir artifacts/npm-packages \
            --version "$VERSION" \
            --tag "$NPM_TAG" \
            --source-revision "$SOURCE_REVISION" \
            --output artifacts/npm-publication.json
      - name: Build bounded release notes
        env:
          COMMIT_COUNT: ${{ inputs.commit_count }}
          NOTES_MODE: ${{ inputs.notes_mode }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          mkdir -p artifacts/release-notes
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          mode = os.environ["NOTES_MODE"]
          custom = os.environ["RELEASE_NOTES"]
          try:
              count = int(os.environ["COMMIT_COUNT"])
          except ValueError as error:
              raise SystemExit("commit_count must be an integer") from error
          if not 1 <= count <= 100:
              raise SystemExit("commit_count must be between 1 and 100")
          if len(custom.encode("utf-8")) > 64 * 1024 or "\0" in custom:
              raise SystemExit("custom release notes exceed their bound")

          if mode == "none":
              notes = ""
          elif mode == "custom":
              if not custom.strip():
                  raise SystemExit("custom release notes are empty")
              notes = custom.rstrip() + "\n"
          elif mode == "commits":
              fields = subprocess.check_output(
                  [
                      "git",
                      "log",
                      f"-n{count}",
                      "--format=%H%x00%h%x00%s",
                      "--no-merges",
                  ],
                  text=True,
                  encoding="utf-8",
              ).splitlines()
              commits = []
              for line in fields:
                  revision, abbreviated, subject = line.split("\0", 2)
                  commits.append(
                      f"- {subject} "
                      f"([`{abbreviated}`](https://github.com/"
                      f"{os.environ['GITHUB_REPOSITORY']}/commit/{revision}))"
                  )
              if not commits:
                  raise SystemExit("commit summary contains no commits")
              notes = "## Changes\n\n" + "\n".join(commits) + "\n"
          else:
              raise SystemExit("release notes mode is invalid")
          Path("artifacts/release-notes/notes.md").write_text(
              notes, encoding="utf-8", newline="\n"
          )
          PY
      - name: Stage uniquely named release assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import shutil

          assets = Path("artifacts/release-assets")
          assets.mkdir()
          sources: list[tuple[Path, str]] = []

          for path in sorted(Path("artifacts/release-candidates").iterdir()):
              if path.is_file():
                  sources.append((path, path.name))
          for path in sorted(Path("artifacts/release-trust").rglob("*")):
              if path.is_file() and "release-verification" not in path.parts:
                  sources.append((path, path.name))

          sboms = Path("artifacts/release-sbom")
          sources.append((sboms / "SHA256SUMS", "rootlight-release-sbom-SHA256SUMS"))
          for target in (
              "aarch64-apple-darwin",
              "aarch64-unknown-linux-gnu",
              "x86_64-apple-darwin",
              "x86_64-pc-windows-msvc",
              "x86_64-unknown-linux-gnu",
          ):
              sources.append(
                  (
                      sboms / target / "rootlight-distribution.cdx.json",
                      f"rootlight-distribution-{target}.cdx.json",
                  )
              )

          updates = Path("artifacts/update-release")
          sources.append(
              (
                  Path("artifacts/npm-publication.json"),
                  "rootlight-npm-publication.json",
              )
          )
          metadata = sorted(updates.rglob("*.update.json"))
          signatures = sorted(updates.rglob("*.update.sig"))
          artifact_signatures = sorted(updates.rglob("*.artifact.sig"))
          expected_prefix = f"rootlight-{os.environ['VERSION']}-"
          if (
              len(metadata) != 5
              or len(signatures) != 5
              or len(artifact_signatures) != 5
          ):
              raise SystemExit("signed update asset set is incomplete")
          if any(
              not path.name.startswith(expected_prefix)
              for path in metadata + signatures + artifact_signatures
          ):
              raise SystemExit("signed update assets differ from the authorized version")
          sources.append(
              (
                  updates / "rootlight-update-public-key.txt",
                  "rootlight-update-public-key.txt",
              )
          )
          for target_dir in sorted(path for path in updates.iterdir() if path.is_dir()):
              target = target_dir.name
              for path in sorted(target_dir.iterdir()):
                  name = (
                      f"rootlight-{target}-licenses.zip"
                      if path.name == "licenses.zip"
                      else path.name
                  )
                  sources.append((path, name))

          destinations = [name for _, name in sources]
          if len(destinations) != len(set(destinations)):
              duplicates = sorted(
                  name for name in set(destinations) if destinations.count(name) > 1
              )
              raise SystemExit(f"release asset names collide: {duplicates!r}")
          if any(not source.is_file() for source, _ in sources):
              missing = sorted(str(source) for source, _ in sources if not source.is_file())
              raise SystemExit(f"release asset source is missing: {missing!r}")
          for source, name in sources:
              shutil.copyfile(source, assets / name)
          if {path.name for path in assets.iterdir()} != set(destinations):
              raise SystemExit("staged release asset set differs")
          PY
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          SOURCE_REVISION: ${{ github.sha }}
          TAG_NAME: ${{ needs.prepare.outputs.tag }}
        run: |
          mapfile -d '' assets < <(
            find artifacts/release-assets -type f -print0 |
              sort --zero-terminated
          )
          test "${#assets[@]}" -gt 0
          prerelease_flag=()
          latest_flag=(--latest)
          if [[ "$PRERELEASE" == "true" ]]; then
            prerelease_flag=(--prerelease)
            latest_flag=(--latest=false)
          fi
          gh release create "$TAG_NAME" \
            --target "$SOURCE_REVISION" \
            --title "Rootlight $TAG_NAME" \
            --notes-file artifacts/release-notes/notes.md \
            "${prerelease_flag[@]}" \
            "${latest_flag[@]}" \
            "${assets[@]}"
