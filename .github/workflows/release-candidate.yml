# Produces one exact-revision native candidate set and its release trust chain.
# The publication workflow consumes these immutable artifacts by run ID and attempt.
name: release candidate
run-name: release candidate / v${{ inputs.release_version }} / ${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Canonical stable or alpha SemVer without the v prefix
        required: true
        type: string
      source_sha:
        description: Exact 40-character source revision selected for this candidate
        required: true
        type: string
      ci_run_id:
        description: Successful required CI run ID for the exact source revision
        required: true
        type: string
      ci_run_attempt:
        description: Successful required CI run attempt for the exact source revision
        required: true
        type: string
      request_id:
        description: Optional correlation identifier for an orchestrated release
        required: false
        default: manual
        type: string
  workflow_call:
    inputs:
      release_version:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      ci_run_id:
        required: true
        type: string
      ci_run_attempt:
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-candidate-${{ inputs.source_sha }}-${{ inputs.release_version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  prepare:
    name: authorize exact required CI revision
    if: github.ref == 'refs/heads/main' && inputs.source_sha == github.sha
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source and successful required aggregate
        env:
          CI_RUN_ATTEMPT: ${{ inputs.ci_run_attempt }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_REVISION: ${{ inputs.source_sha }}
          WORKFLOW_REVISION: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-alpha\.(0|[1-9][0-9]*))?$ ]]
          python - <<'PY'
          import json
          import os
          import re
          import subprocess

          source_revision = os.environ["SOURCE_REVISION"]
          if not re.fullmatch(r"[0-9a-f]{40}", source_revision):
              raise SystemExit("source_sha must be a canonical lowercase Git revision")
          if source_revision != os.environ["WORKFLOW_REVISION"]:
              raise SystemExit("candidate source_sha differs from the selected workflow revision")

          run = json.loads(
              subprocess.check_output(
                  [
                      "gh",
                      "api",
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                      f"{os.environ['CI_RUN_ID']}",
                  ]
              )
          )
          expected_run = {
              "conclusion": "success",
              "event": "push",
              "head_sha": source_revision,
              "path": ".github/workflows/ci.yml",
              "run_attempt": int(os.environ["CI_RUN_ATTEMPT"]),
          }
          observed_run = {key: run.get(key) for key in expected_run}
          if observed_run != expected_run:
              raise SystemExit(
                  f"required CI run does not authorize this candidate: {observed_run!r}"
              )

          jobs = json.loads(
              subprocess.check_output(
                  [
                      "gh",
                      "api",
                      f"/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                      f"{os.environ['CI_RUN_ID']}/jobs?filter=latest&per_page=100",
                  ]
              )
          )["jobs"]
          aggregates = [
              job for job in jobs
              if job.get("name") == "ci-required"
              and job.get("run_attempt") == int(os.environ["CI_RUN_ATTEMPT"])
          ]
          if len(aggregates) != 1 or aggregates[0].get("conclusion") != "success":
              raise SystemExit("exact required CI aggregate did not succeed")
          PY

  web-release-assets:
    name: target-neutral web release assets
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/rootlight-web/frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Node.js and npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: apps/rootlight-web/frontend/package-lock.json
          package-manager-cache: false
      - name: Build and verify the exact target-neutral asset set
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(node --version)" = "v24.11.1"
          test "$(npm --version)" = "11.6.2"
          npm ci --ignore-scripts
          npm run release:dependencies
          npm audit --omit=dev --audit-level=moderate
          npm run check
          mkdir -p "$GITHUB_WORKSPACE/artifacts/web-release/dist"
          cp -R dist/. "$GITHUB_WORKSPACE/artifacts/web-release/dist/"
          npm run release:notices -- \
            --output "$GITHUB_WORKSPACE/artifacts/web-release/rootlight-web-third-party-notices.txt"
          npm run release:verify -- \
            --assets-dir dist \
            --notices "$GITHUB_WORKSPACE/artifacts/web-release/rootlight-web-third-party-notices.txt" \
            --npm-version 11.6.2 \
            --output "$GITHUB_WORKSPACE/artifacts/web-release/web-release.json" \
            --source-revision "$SOURCE_REVISION" \
            --version "$RELEASE_VERSION"
          rm -rf dist
          npm run build
          diff --recursive \
            "$GITHUB_WORKSPACE/artifacts/web-release/dist" \
            dist
      - name: Upload the immutable target-neutral asset set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootlight-web-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/web-release
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false

  release-package-candidate:
    name: release package / ${{ matrix.target }}
    needs: [prepare, web-release-assets]
    # INTENTIONAL: both release builds start without restored compiled output.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: rustup show active-toolchain
      - name: Download exact target-neutral web release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootlight-web-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/web-release
      - name: Build native release package from two clean build directories
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          ROOTLIGHT_RELEASE_VERSION: ${{ inputs.release_version }}
          RUNNER_LABEL: ${{ matrix.os }}
          SOURCE_REVISION: ${{ github.sha }}
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "$TARGET_TRIPLE"
          version="$RELEASE_VERSION"
          cargo run --locked --quiet --package xtask -- package-check
          reproducible_rustflags=""
          if [[ "$TARGET_TRIPLE" == *windows* ]]; then
            reproducible_rustflags="-C link-arg=/Brepro -C link-arg=/PDBALTPATH:%_PDB%"
          fi
          RUSTFLAGS="$reproducible_rustflags" \
            CARGO_TARGET_DIR="$PWD/target/repro-first" cargo build \
            --locked --release --target "$TARGET_TRIPLE" \
            --package rootlight \
            --package rootlight-adapter-host \
            --package rootlight-daemon \
            --package rootlight-launcher \
            --package rootlight-mcp \
            --package rootlight-semantic-host \
            --package rootlight-web
          RUSTFLAGS="$reproducible_rustflags" \
            CARGO_TARGET_DIR="$PWD/target/repro-second" cargo build \
            --locked --release --target "$TARGET_TRIPLE" \
            --package rootlight \
            --package rootlight-adapter-host \
            --package rootlight-daemon \
            --package rootlight-launcher \
            --package rootlight-mcp \
            --package rootlight-semantic-host \
            --package rootlight-web
          suffix=""
          if [[ "$TARGET_TRIPLE" == *windows* ]]; then
            suffix=".exe"
          fi
          for binary in \
            rootlight \
            rootlight-adapter-host \
            rootlight-daemon \
            rootlight-launcher \
            rootlight-mcp \
            rootlight-semantic-host \
            rootlight-web; do
            cmp \
              "target/repro-first/$TARGET_TRIPLE/release/${binary}${suffix}" \
              "target/repro-second/$TARGET_TRIPLE/release/${binary}${suffix}"
          done
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"release-audit","version":"1.0.0"}}}' |
            "target/repro-first/$TARGET_TRIPLE/release/rootlight-mcp${suffix}" \
              > target/release-version.jsonl
          "target/repro-first/$TARGET_TRIPLE/release/rootlight${suffix}" \
            --version --json > target/release-cli-version.json
          VERSION="$version" python - <<'PY'
          import json
          import os
          from pathlib import Path

          lines = Path("target/release-version.jsonl").read_text(
              encoding="utf-8"
          ).splitlines()
          if len(lines) != 1:
              raise SystemExit("release MCP version probe emitted an unexpected frame count")
          response = json.loads(lines[0])
          observed = response.get("result", {}).get("serverInfo", {}).get("version")
          if observed != os.environ["VERSION"]:
              raise SystemExit("release MCP version differs from the candidate version")

          cli = json.loads(Path("target/release-cli-version.json").read_text(encoding="utf-8"))
          observed = cli.get("result", {}).get("data", {}).get("version")
          if observed != os.environ["VERSION"]:
              raise SystemExit("release CLI version differs from the candidate version")
          observed_revision = cli.get("result", {}).get("data", {}).get("source_revision")
          if observed_revision != os.environ["SOURCE_REVISION"]:
              raise SystemExit("release CLI source revision differs from the candidate revision")
          PY
          cargo run --locked --quiet --package xtask -- package-build \
            --target "$TARGET_TRIPLE" \
            --version "$version" \
            --source-revision "$SOURCE_REVISION" \
            --bin-dir "target/repro-first/$TARGET_TRIPLE/release" \
            --web-assets-dir artifacts/web-release/dist \
            --web-notices artifacts/web-release/rootlight-web-third-party-notices.txt \
            --output-dir artifacts/release-candidate-first
          cargo run --locked --quiet --package xtask -- package-build \
            --target "$TARGET_TRIPLE" \
            --version "$version" \
            --source-revision "$SOURCE_REVISION" \
            --bin-dir "target/repro-second/$TARGET_TRIPLE/release" \
            --web-assets-dir artifacts/web-release/dist \
            --web-notices artifacts/web-release/rootlight-web-third-party-notices.txt \
            --output-dir artifacts/release-candidate-second
          archive="artifacts/release-candidate-first/rootlight-$version-$TARGET_TRIPLE.zip"
          cargo run --locked --quiet --package xtask -- package-verify \
            --archive "$archive"
          cargo run --locked --quiet --package xtask -- package-verify \
            --archive "artifacts/release-candidate-second/rootlight-$version-$TARGET_TRIPLE.zip"
          diff --recursive \
            artifacts/release-candidate-first \
            artifacts/release-candidate-second
          cargo run --locked --quiet --package xtask -- package-build \
            --target "$TARGET_TRIPLE" \
            --version 0.0.0 \
            --source-revision "$SOURCE_REVISION" \
            --bin-dir "target/repro-first/$TARGET_TRIPLE/release" \
            --web-assets-dir artifacts/web-release/dist \
            --web-notices artifacts/web-release/rootlight-web-third-party-notices.txt \
            --output-dir artifacts/release-baseline
          lifecycle="artifacts/release-candidate-first/$TARGET_TRIPLE.lifecycle.json"
          cargo run --locked --quiet --package xtask -- package-smoke \
            --baseline-archive "artifacts/release-baseline/rootlight-0.0.0-$TARGET_TRIPLE.zip" \
            --archive "$archive" \
            --source-revision "$SOURCE_REVISION" \
            --output "$lifecycle"
          candidate_sha256="$(cut -d ' ' -f 1 "$archive.sha256")"
          python scripts/validate-package-lifecycle.py \
            --path "$lifecycle" \
            --target "$TARGET_TRIPLE" \
            --candidate-version "$version" \
            --source-revision "$SOURCE_REVISION" \
            --candidate-archive "$(basename "$archive")" \
            --candidate-sha256 "$candidate_sha256"
          web_smoke="artifacts/release-candidate-first/$TARGET_TRIPLE.web-smoke.json"
          python scripts/verify-installed-web.py \
            --archive "$archive" \
            --candidate-version "$version" \
            --output "$web_smoke" \
            --source-revision "$SOURCE_REVISION" \
            --target "$TARGET_TRIPLE"
          ARCHIVE="$archive" \
            LIFECYCLE="$lifecycle" \
            RUSTC_HOST="$host" \
            VERSION="$version" \
            WEB_RELEASE_REPORT=artifacts/web-release/web-release.json \
            WEB_SMOKE="$web_smoke" \
            python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import zipfile

          archive = Path(os.environ["ARCHIVE"])
          target = os.environ["TARGET_TRIPLE"]
          required = {
              "LICENSE",
              "NOTICE",
              "licenses/rootlight-web-third-party-notices.txt",
              "licenses/tree-sitter-cpp-0.23.4-LICENSE",
              "licenses/tree-sitter-java-0.23.5-LICENSE",
              "licenses/tree-sitter-kotlin-ng-1.1.0-LICENSE",
              "licenses/tree-sitter-typescript-0.23.2-LICENSE",
              "package-manifest.json",
              "share/rootlight/web/asset-manifest.json",
              "share/rootlight/web/index.html",
          }
          suffix = ".exe" if target == "x86_64-pc-windows-msvc" else ""
          required.add(f"bin/rootlight-web{suffix}")
          with zipfile.ZipFile(archive) as package:
              names = set(package.namelist())
              web_manifest_bytes = package.read(
                  "share/rootlight/web/asset-manifest.json"
              )
          if not required <= names:
              raise SystemExit(f"release package lacks required notices: {required - names!r}")
          sha256 = archive.with_name(archive.name + ".sha256").read_text(
              encoding="utf-8"
          ).split("  ", 1)[0]
          if sha256 != hashlib.sha256(archive.read_bytes()).hexdigest():
              raise SystemExit("release package SHA-256 sidecar differs")
          blake3 = archive.with_name(archive.name + ".blake3").read_text(
              encoding="utf-8"
          ).split("  ", 1)[0]
          if not re.fullmatch(r"[0-9a-f]{64}", blake3):
              raise SystemExit("release package BLAKE3 sidecar is not canonical")
          lifecycle_path = Path(os.environ["LIFECYCLE"])
          lifecycle = json.loads(lifecycle_path.read_bytes())
          lifecycle_expected = {
              "baseline_archive": f"rootlight-0.0.0-{target}.zip",
              "baseline_version": "0.0.0",
              "candidate_archive": archive.name,
              "candidate_sha256": sha256,
              "candidate_target": target,
              "candidate_version": os.environ["VERSION"],
              "committed_active_version": os.environ["VERSION"],
              "committed_last_good_version": "0.0.0",
              "rollback_active_version": "0.0.0",
              "schema": "rootlight.package-lifecycle/5",
              "source_revision": os.environ["SOURCE_REVISION"],
          }
          if {
              key: lifecycle.get(key) for key in lifecycle_expected
          } != lifecycle_expected:
              raise SystemExit(f"release package lifecycle differs: {lifecycle!r}")
          observations = (
              "candidate_health_observed",
              "clean_recovery_observed",
              "failed_health_rollback_observed",
              "installed_command_uninstall_observed",
              "launcher_probe_observed",
              "unowned_data_preserved",
              "user_data_preserved",
              "web_payload_owned",
              "web_payload_rollback_observed",
              "web_payload_uninstall_observed",
              "web_payload_version_bound",
          )
          if any(lifecycle.get(field) is not True for field in observations):
              raise SystemExit(f"release package lifecycle is incomplete: {lifecycle!r}")
          if lifecycle.get("bootstrap_owned_files", 0) < 1:
              raise SystemExit("release package bootstrap owned no files")
          if lifecycle.get("uninstall_removed_versions") != 2:
              raise SystemExit("release package uninstall did not remove both owned versions")
          lifecycle_sha256 = hashlib.sha256(lifecycle_path.read_bytes()).hexdigest()
          web_report_path = Path(os.environ["WEB_RELEASE_REPORT"])
          web_report_bytes = web_report_path.read_bytes()
          web_report = json.loads(web_report_bytes)
          web_expected = {
              "asset_manifest_sha256": hashlib.sha256(web_manifest_bytes).hexdigest(),
              "node_version": "24.11.1",
              "npm_version": "11.6.2",
              "source_revision": os.environ["SOURCE_REVISION"],
              "version": os.environ["VERSION"],
          }
          if {key: web_report.get(key) for key in web_expected} != web_expected:
              raise SystemExit(f"web release evidence differs: {web_report!r}")
          web_smoke_path = Path(os.environ["WEB_SMOKE"])
          web_smoke_bytes = web_smoke_path.read_bytes()
          web_smoke = json.loads(web_smoke_bytes)
          if (
              web_smoke.get("schema") != "rootlight.installed-web-smoke/3"
              or web_smoke.get("target") != target
              or web_smoke.get("candidate_version") != os.environ["VERSION"]
              or web_smoke.get("elevated_startup_rejected")
              is not (target == "x86_64-pc-windows-msvc")
              or any(
                  web_smoke.get(field)
                  is not (target != "x86_64-pc-windows-msvc")
                  for field in (
                      "authenticated_health_observed",
                      "graceful_shutdown_observed",
                      "direct_session_observed",
                  )
              )
              or web_smoke.get("native_cli_dispatch_observed") is not True
              or web_smoke.get("node_runtime_required") is not False
          ):
              raise SystemExit(f"installed web smoke evidence differs: {web_smoke!r}")
          document = {
              "schema": "rootlight.release-package-candidate/2",
              "archive": archive.name,
              "blake3": blake3,
              "cargo_version": subprocess.check_output(
                  ["cargo", "--version"], text=True
              ).strip(),
              "independent_archives": "bit_identical",
              "independent_builds": "bit_identical",
              "lifecycle_report": lifecycle_path.name,
              "lifecycle_sha256": lifecycle_sha256,
              "runner": os.environ["RUNNER_LABEL"],
              "rustc_host": os.environ["RUSTC_HOST"],
              "rustc_version": subprocess.check_output(
                  ["rustc", "--version", "--verbose"], text=True
              ).strip(),
              "sha256": sha256,
              "source_revision": os.environ["SOURCE_REVISION"],
              "target": target,
              "version": os.environ["VERSION"],
              "web_asset_manifest_sha256": web_report["asset_manifest_sha256"],
              "web_node_version": web_report["node_version"],
              "web_notice_sha256": web_report["notice_sha256"],
              "web_npm_version": web_report["npm_version"],
              "web_package_json_sha256": web_report["package_json_sha256"],
              "web_package_lock_sha256": web_report["package_lock_sha256"],
              "web_release_report_sha256": hashlib.sha256(web_report_bytes).hexdigest(),
              "web_smoke_report": web_smoke_path.name,
              "web_smoke_sha256": hashlib.sha256(web_smoke_bytes).hexdigest(),
          }
          (archive.parent / f"{target}.candidate.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootlight-release-candidate-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-candidate-first
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false

  release-candidate-evidence:
    name: release package reproducibility / linux
    needs: [prepare, release-package-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Download exact candidate set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rootlight-release-candidate-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-candidates
          merge-multiple: true
      - name: Independently validate all native candidates
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          version="$RELEASE_VERSION"
          for target in \
            aarch64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc \
            x86_64-unknown-linux-gnu; do
            archive="artifacts/release-candidates/rootlight-$version-$target.zip"
            cargo run --locked --quiet --package xtask -- package-verify --archive "$archive"
            python scripts/validate-package-lifecycle.py \
              --path "artifacts/release-candidates/$target.lifecycle.json" \
              --target "$target" \
              --candidate-version "$version" \
              --source-revision "$SOURCE_REVISION" \
              --candidate-archive "$(basename "$archive")" \
              --candidate-sha256 "$(cut -d ' ' -f 1 "$archive.sha256")"
          done
          VERSION="$version" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/release-candidates")
          targets = {
              "aarch64-apple-darwin",
              "aarch64-unknown-linux-gnu",
              "x86_64-apple-darwin",
              "x86_64-pc-windows-msvc",
              "x86_64-unknown-linux-gnu",
          }
          version = os.environ["VERSION"]
          expected = set()
          for target in targets:
              archive = f"rootlight-{version}-{target}.zip"
              expected |= {
                  archive,
                  f"{archive}.sha256",
                  f"{archive}.blake3",
                  f"{target}.candidate.json",
                  f"{target}.lifecycle.json",
                  f"{target}.web-smoke.json",
              }
          observed = {path.name for path in root.iterdir()}
          if observed != expected:
              raise SystemExit(
                  f"release candidate artifact set differs: "
                  f"missing={sorted(expected - observed)!r}, "
                  f"extra={sorted(observed - expected)!r}"
              )
          for target in targets:
              document = json.loads(
                  (root / f"{target}.candidate.json").read_bytes()
              )
              archive = f"rootlight-{version}-{target}.zip"
              expected_fields = {
                  "archive": archive,
                  "independent_archives": "bit_identical",
                  "independent_builds": "bit_identical",
                  "lifecycle_report": f"{target}.lifecycle.json",
                  "rustc_host": target,
                  "schema": "rootlight.release-package-candidate/2",
                  "source_revision": os.environ["SOURCE_REVISION"],
                  "target": target,
                  "version": version,
                  "web_node_version": "24.11.1",
                  "web_npm_version": "11.6.2",
                  "web_smoke_report": f"{target}.web-smoke.json",
              }
              observed_fields = {
                  key: document.get(key) for key in expected_fields
              }
              if observed_fields != expected_fields:
                  raise SystemExit(
                      f"{target} candidate record differs: {document!r}"
                  )
              lifecycle_path = root / f"{target}.lifecycle.json"
              lifecycle_bytes = lifecycle_path.read_bytes()
              lifecycle_sha256 = hashlib.sha256(lifecycle_bytes).hexdigest()
              if document.get("lifecycle_sha256") != lifecycle_sha256:
                  raise SystemExit(f"{target} lifecycle digest differs")
              lifecycle = json.loads(lifecycle_bytes)
              archive_sha256 = (
                  root / f"{archive}.sha256"
              ).read_text(encoding="utf-8").split("  ", 1)[0]
              lifecycle_expected = {
                  "baseline_archive": f"rootlight-0.0.0-{target}.zip",
                  "baseline_version": "0.0.0",
                  "candidate_archive": archive,
                  "candidate_sha256": archive_sha256,
                  "candidate_target": target,
                  "candidate_version": version,
                  "committed_active_version": version,
                  "committed_last_good_version": "0.0.0",
                  "rollback_active_version": "0.0.0",
                  "schema": "rootlight.package-lifecycle/5",
                  "source_revision": os.environ["SOURCE_REVISION"],
              }
              if {
                  key: lifecycle.get(key) for key in lifecycle_expected
              } != lifecycle_expected:
                  raise SystemExit(f"{target} lifecycle differs: {lifecycle!r}")
              observations = (
                  "candidate_health_observed",
                  "clean_recovery_observed",
                  "failed_health_rollback_observed",
                  "launcher_probe_observed",
                  "unowned_data_preserved",
                  "user_data_preserved",
                  "web_payload_owned",
                  "web_payload_rollback_observed",
                  "web_payload_uninstall_observed",
                  "web_payload_version_bound",
              )
              if any(lifecycle.get(field) is not True for field in observations):
                  raise SystemExit(f"{target} lifecycle is incomplete: {lifecycle!r}")
              if lifecycle.get("bootstrap_owned_files", 0) < 1:
                  raise SystemExit(f"{target} bootstrap owned no files")
              if lifecycle.get("uninstall_removed_versions") != 2:
                  raise SystemExit(f"{target} uninstall did not remove both versions")
              web_smoke_path = root / f"{target}.web-smoke.json"
              web_smoke_bytes = web_smoke_path.read_bytes()
              if (
                  document.get("web_smoke_sha256")
                  != hashlib.sha256(web_smoke_bytes).hexdigest()
              ):
                  raise SystemExit(f"{target} installed web smoke digest differs")
              web_smoke = json.loads(web_smoke_bytes)
              if (
                  web_smoke.get("schema") != "rootlight.installed-web-smoke/3"
                  or web_smoke.get("target") != target
                  or web_smoke.get("candidate_version") != version
                  or web_smoke.get("node_runtime_required") is not False
              ):
                  raise SystemExit(f"{target} installed web smoke differs")
          PY

  supply-chain:
    name: supply chain / linux
    needs: [prepare, web-release-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Install checksum-verified policy tools
        run: bash scripts/install-policy-tools.sh "$HOME/.local/bin"
      - name: Download exact target-neutral web release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rootlight-web-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/web-release
      - name: Acquire audit inputs
        run: |
          cargo fetch --locked
          bash scripts/download-rustsec-database.sh artifacts/rustsec-db
          bash scripts/download-osv-database.sh artifacts/osv-db
      - name: Dependency, license, source, and advisory policy
        run: |
          cargo deny check bans licenses sources
          cargo audit --db artifacts/rustsec-db --no-fetch -D warnings
          OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY="$PWD/artifacts/osv-db" \
            osv-scanner scan source --offline --format json --lockfile Cargo.lock \
            > artifacts/osv-report.json
      - name: Secret scan
        run: gitleaks git --redact=100 --no-banner --no-color --log-level warn .
      - name: Security negative controls
        run: bash scripts/policy-negative-controls.sh
      - name: Unsafe inventory
        shell: bash
        run: bash scripts/run-geiger.sh "$HOME/.local/bin/cargo-geiger" artifacts/geiger
      - name: Generate deterministic SBOM inputs
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          bash scripts/generate-sbom.sh artifacts/sbom-first
          bash scripts/generate-sbom.sh artifacts/sbom-second
          diff -ru artifacts/sbom-first artifacts/sbom-second
          python scripts/generate-release-sboms.py \
            --output artifacts/release-sbom-first \
            --source-revision "$SOURCE_REVISION" \
            --web-assets-dir artifacts/web-release/dist \
            --web-notices artifacts/web-release/rootlight-web-third-party-notices.txt
          python scripts/generate-release-sboms.py \
            --output artifacts/release-sbom-second \
            --source-revision "$SOURCE_REVISION" \
            --web-assets-dir artifacts/web-release/dist \
            --web-notices artifacts/web-release/rootlight-web-third-party-notices.txt
          diff -ru artifacts/release-sbom-first artifacts/release-sbom-second
          while IFS= read -r -d '' sbom; do
            cyclonedx validate \
              --input-file "$sbom" \
              --input-format json \
              --input-version v1_5 \
              --fail-on-errors
          done < <(
            find artifacts/sbom-first artifacts/release-sbom-first \
              -type f -name '*.cdx.json' -print0 |
              sort --zero-terminated
          )
      - name: Reject host paths in generated evidence
        run: |
          if grep --recursive --fixed-strings --binary-files=without-match "$PWD" \
            artifacts/sbom-first artifacts/sbom-second \
            artifacts/release-sbom-first artifacts/release-sbom-second \
            artifacts/osv-report.json; then
            echo "supply-chain evidence contains the checkout path" >&2
            exit 1
          fi
      - name: Upload deterministic target-specific release SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootlight-release-sbom-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-sbom-first
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false

  unsafe-inventory-windows:
