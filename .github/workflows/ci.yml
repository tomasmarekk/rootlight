name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fast:
    name: fast / pinned / linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Architecture and contracts
        run: |
          cargo run --locked --quiet --package xtask -- architecture-check
          cargo run --locked --quiet --package xtask -- generate --check
          cargo run --locked --quiet --package xtask -- compatibility-check
          cargo run --locked --quiet --package xtask -- mcp-compatibility-check
          cargo run --locked --quiet --package xtask -- budget-conformance-check
          cargo run --locked --quiet --package xtask -- policy-check
          cargo run --locked --quiet --package xtask -- license-check
          cargo run --locked --quiet --package xtask -- id-vectors > target/id-vectors.actual.json
          cmp tests/fixtures/id-vectors.json target/id-vectors.actual.json
      - name: Capability parity and evidence
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          mkdir -p target/capability-parity target/capability-parity-second
          cargo run --locked --quiet --package xtask -- capability-check \
            --output-dir target/capability-parity \
            --source-revision "$SOURCE_REVISION"
          cargo run --locked --quiet --package xtask -- capability-check \
            --output-dir target/capability-parity-second \
            --source-revision "$SOURCE_REVISION"
          diff --recursive target/capability-parity target/capability-parity-second
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("target/capability-parity")
          expected_files = {
              "capability-execution-matrix-v1.json",
              "capability-initial-mismatches-v1.json",
              "capability-parity-report-v1.json",
              "capability-registry-v1.json",
          }
          if {path.name for path in root.iterdir()} != expected_files:
              raise SystemExit("capability artifact set differs")

          revision = os.environ["SOURCE_REVISION"]
          report = json.loads(
              (root / "capability-parity-report-v1.json").read_bytes()
          )
          expected_report = {
              "schema": "rootlight.mcp-capability-parity/1",
              "sourceRevision": revision,
              "status": "passed",
              "toolCount": 19,
              "reviewedInputFields": 565,
              "schemaGoldenPairs": 19,
              "profileCounts": {
                  "scout": 6,
                  "analysis": 13,
                  "developer": 19,
              },
              "blockedGaps": 0,
          }
          if report != expected_report:
              raise SystemExit(f"capability parity report differs: {report!r}")

          registry = json.loads(
              (root / "capability-registry-v1.json").read_bytes()
          )
          if (
              registry.get("schema") != "rootlight.mcp-capability-registry/1"
              or registry.get("sourceRevision") != revision
              or len(registry.get("tools", [])) != 19
          ):
              raise SystemExit("capability registry artifact differs")

          matrix = json.loads(
              (root / "capability-execution-matrix-v1.json").read_bytes()
          )
          cases = matrix.get("cases")
          if (
              matrix.get("schema") != "rootlight.mcp-execution-matrix/1"
              or matrix.get("sourceRevision") != revision
              or not isinstance(cases, list)
              or not cases
              or any(
                  case.get("observation") != "not_run"
                  or case.get("verdict") != "unknown"
                  for case in cases
              )
          ):
              raise SystemExit("execution matrix overstates observed behavior")

          encoded = b"".join(path.read_bytes() for path in sorted(root.iterdir()))
          if str(Path.cwd()).encode() in encoded:
              raise SystemExit("capability artifacts contain the checkout path")
          PY
      - name: Upload immutable capability parity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootlight-mcp-capability-parity-v1-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/capability-parity
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false
      - name: Disposition validation
        run: |
          mkdir -p target/disposition-validation
          set -o pipefail
          {
            cargo run --locked --quiet --package xtask -- disposition-check --root tests/fixtures/disposition
            for fixture in tests/fixtures/disposition/invalid/*; do
              if cargo run --locked --quiet --package xtask -- disposition-check --root "$fixture"; then
                echo "invalid disposition fixture was unexpectedly accepted: $fixture"
                exit 1
              fi
              echo "invalid disposition fixture rejected as required: $fixture"
            done
          } 2>&1 | tee target/disposition-validation/report.txt
      - name: Retain disposition validation
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: disposition-validation-${{ github.sha }}-${{ github.run_attempt }}
          path: target/disposition-validation/report.txt
          if-no-files-found: error
          retention-days: 90
      - name: Daemon lifecycle
        run: |
          cargo build --locked --package rootlight --package rootlight-daemon --package xtask
          cargo run --locked --quiet --package xtask -- daemon-lifecycle-check --bin-dir target/debug
      - name: Verify support-bundle privacy
        run: |
          cargo test --locked --package rootlight-observability --lib \
            tests::support_archive_is_deterministic_and_allow_listed -- --exact
          cargo test --locked --package rootlight-observability --lib \
            tests::support_archive_never_accepts_arbitrary_sensitive_payloads -- --exact
          cargo test --locked --package rootlight-client --lib \
            tests::support_bundle_decoder_enforces_privacy_size_digest_and_shape -- --exact
          cargo test --locked --package rootlight-daemon-core --lib \
            tests::diagnostics_and_support_bundle_are_source_free_and_wire_stable -- --exact
      - name: Clean generated tree
        run: git diff --exit-code

  msrv:
    name: msrv / 1.90.0 / linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install MSRV
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
          test "$(rustc --version)" = "$(rustup run 1.90.0 rustc --version)"
      - name: MSRV quality suite
        run: |
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo run --locked --quiet --package xtask -- architecture-check
          cargo run --locked --quiet --package xtask -- generate --check
          cargo run --locked --quiet --package xtask -- compatibility-check
          cargo run --locked --quiet --package xtask -- mcp-compatibility-check
          cargo run --locked --quiet --package xtask -- policy-check

  current-stable:
    name: current stable / linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          test "$(rustc --version)" = "$(rustup run stable rustc --version)"
      - name: Current-stable quality canary
        run: |
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked

  platform:
    name: platform / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: rustup show active-toolchain
      - name: Platform contract suite
        shell: bash
        run: |
          cargo check --workspace --all-targets --all-features --locked
          cargo test --workspace --all-features --locked
          cargo run --locked --quiet --package xtask -- architecture-check
          cargo run --locked --quiet --package xtask -- generate --check
          cargo run --locked --quiet --package xtask -- compatibility-check
          cargo run --locked --quiet --package xtask -- policy-check
          cargo run --locked --quiet --package xtask -- id-vectors > target/id-vectors.actual.json
      - name: Daemon lifecycle
        shell: bash
        run: |
          cargo build --locked --package rootlight --package rootlight-daemon --package xtask
          cargo run --locked --quiet --package xtask -- daemon-lifecycle-check --bin-dir target/debug
      - name: Compare identifier vectors
        shell: pwsh
        run: |
          $expected = (Get-Content tests/fixtures/id-vectors.json -Raw).Replace("`r`n", "`n")
          $actual = (Get-Content target/id-vectors.actual.json -Raw).Replace("`r`n", "`n")
          if ($actual -cne $expected) {
            throw "identifier vectors differ from the committed fixture"
          }
      - name: Clean generated tree
        shell: bash
        run: git diff --exit-code

  vertical-slice:
    name: vertical slice / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: rustup show active-toolchain
      - name: Build vertical-slice binaries
        shell: bash
        run: cargo build --locked --package rootlight-daemon --package rootlight-mcp --package xtask
      - name: Run vertical-slice integration check
        shell: bash
        run: cargo run --locked --quiet --package xtask -- mcp-vertical-check --bin-dir target/debug --output-dir artifacts/vertical-slice/${{ matrix.os }}
      - name: Upload vertical-slice evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vertical-slice-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/vertical-slice/${{ matrix.os }}/summary.json
            artifacts/vertical-slice/${{ matrix.os }}/transcript.jsonl
            artifacts/vertical-slice/${{ matrix.os }}/failure.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false

  package-evidence:
    name: package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-2025
          - os: macos-15
          - os: macos-15-intel
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: rustup show active-toolchain
      - name: Validate package contract
        shell: bash
        run: cargo run --locked --quiet --package xtask -- package-check
      - name: Build native release package from two clean build directories
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          target="$(rustc -vV | sed -n 's/^host: //p')"
          version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "rootlight"))'
          )"
          reproducible_rustflags=""
          if [[ "$target" == *windows* ]]; then
            reproducible_rustflags="-C link-arg=/Brepro -C link-arg=/PDBALTPATH:%_PDB%"
          fi
          RUSTFLAGS="$reproducible_rustflags" \
            CARGO_TARGET_DIR="$PWD/target/repro-first" cargo build --locked --release \
            --package rootlight \
            --package rootlight-adapter-host \
            --package rootlight-daemon \
            --package rootlight-launcher \
            --package rootlight-mcp
          RUSTFLAGS="$reproducible_rustflags" \
            CARGO_TARGET_DIR="$PWD/target/repro-second" cargo build --locked --release \
            --package rootlight \
            --package rootlight-adapter-host \
            --package rootlight-daemon \
            --package rootlight-launcher \
            --package rootlight-mcp
          suffix=""
          if [[ "$target" == *windows* ]]; then
            suffix=".exe"
          fi
          for binary in \
            rootlight \
            rootlight-adapter-host \
            rootlight-daemon \
            rootlight-launcher \
            rootlight-mcp; do
            cmp \
              "target/repro-first/release/${binary}${suffix}" \
              "target/repro-second/release/${binary}${suffix}"
          done
          cargo run --locked --quiet --package xtask -- package-build \
            --target "$target" \
            --version "$version" \
            --source-revision "$SOURCE_REVISION" \
            --bin-dir target/repro-first/release \
            --output-dir artifacts/packages-first
          cargo run --locked --quiet --package xtask -- package-build \
            --target "$target" \
            --version "$version" \
            --source-revision "$SOURCE_REVISION" \
            --bin-dir target/repro-second/release \
            --output-dir artifacts/packages-second
          diff --recursive artifacts/packages-first artifacts/packages-second
          cargo run --locked --quiet --package xtask -- package-build \
            --target "$target" \
            --version 0.0.0 \
            --source-revision "$SOURCE_REVISION" \
            --bin-dir target/repro-first/release \
            --output-dir artifacts/package-baseline
          cargo run --locked --quiet --package xtask -- package-smoke \
            --baseline-archive "artifacts/package-baseline/rootlight-0.0.0-$target.zip" \
            --archive "artifacts/packages-first/rootlight-$version-$target.zip" \
            --source-revision "$SOURCE_REVISION" \
            --output "artifacts/packages-first/$target.lifecycle.json"
      - name: Upload native package evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootlight-package-${{ matrix.os }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/packages-first
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false
  release-package-candidate:
    name: release package / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: rustup show active-toolchain
      - name: Build native release package from two clean build directories
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.os }}
          SOURCE_REVISION: ${{ github.sha }}
          TARGET_TRIPLE: ${{ matrix.target }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          host="$(rustc -vV | sed -n 's/^host: //p')"
          test "$host" = "$TARGET_TRIPLE"
          version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "rootlight"))'
          )"
          cargo run --locked --quiet --package xtask -- package-check
          reproducible_rustflags=""
          if [[ "$TARGET_TRIPLE" == *windows* ]]; then
            reproducible_rustflags="-C link-arg=/Brepro -C link-arg=/PDBALTPATH:%_PDB%"
          fi
          RUSTFLAGS="$reproducible_rustflags" \
            CARGO_TARGET_DIR="$PWD/target/repro-first" cargo build \
            --locked --release --target "$TARGET_TRIPLE" \
            --package rootlight \
            --package rootlight-adapter-host \
            --package rootlight-daemon \
            --package rootlight-launcher \
            --package rootlight-mcp
          RUSTFLAGS="$reproducible_rustflags" \
            CARGO_TARGET_DIR="$PWD/target/repro-second" cargo build \
            --locked --release --target "$TARGET_TRIPLE" \
            --package rootlight \
            --package rootlight-adapter-host \
            --package rootlight-daemon \
            --package rootlight-launcher \
            --package rootlight-mcp
          suffix=""
          if [[ "$TARGET_TRIPLE" == *windows* ]]; then
            suffix=".exe"
          fi
          for binary in \
            rootlight \
            rootlight-adapter-host \
            rootlight-daemon \
            rootlight-launcher \
            rootlight-mcp; do
            cmp \
              "target/repro-first/$TARGET_TRIPLE/release/${binary}${suffix}" \
              "target/repro-second/$TARGET_TRIPLE/release/${binary}${suffix}"
          done
          cargo run --locked --quiet --package xtask -- package-build \
            --target "$TARGET_TRIPLE" \
            --version "$version" \
            --source-revision "$SOURCE_REVISION" \
            --bin-dir "target/repro-first/$TARGET_TRIPLE/release" \
            --output-dir artifacts/release-candidate-first
          cargo run --locked --quiet --package xtask -- package-build \
            --target "$TARGET_TRIPLE" \
            --version "$version" \
            --source-revision "$SOURCE_REVISION" \
            --bin-dir "target/repro-second/$TARGET_TRIPLE/release" \
            --output-dir artifacts/release-candidate-second
          archive="artifacts/release-candidate-first/rootlight-$version-$TARGET_TRIPLE.zip"
          cargo run --locked --quiet --package xtask -- package-verify \
            --archive "$archive"
          cargo run --locked --quiet --package xtask -- package-verify \
            --archive "artifacts/release-candidate-second/rootlight-$version-$TARGET_TRIPLE.zip"
          diff --recursive \
            artifacts/release-candidate-first \
            artifacts/release-candidate-second
          cargo run --locked --quiet --package xtask -- package-build \
            --target "$TARGET_TRIPLE" \
            --version 0.0.0 \
            --source-revision "$SOURCE_REVISION" \
            --bin-dir "target/repro-first/$TARGET_TRIPLE/release" \
            --output-dir artifacts/release-baseline
          lifecycle="artifacts/release-candidate-first/$TARGET_TRIPLE.lifecycle.json"
          cargo run --locked --quiet --package xtask -- package-smoke \
            --baseline-archive "artifacts/release-baseline/rootlight-0.0.0-$TARGET_TRIPLE.zip" \
            --archive "$archive" \
            --source-revision "$SOURCE_REVISION" \
            --output "$lifecycle"
          ARCHIVE="$archive" LIFECYCLE="$lifecycle" RUSTC_HOST="$host" VERSION="$version" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import zipfile

          archive = Path(os.environ["ARCHIVE"])
          target = os.environ["TARGET_TRIPLE"]
          required = {
              "LICENSE",
              "NOTICE",
              "licenses/tree-sitter-cpp-0.23.4-LICENSE",
              "licenses/tree-sitter-java-0.23.5-LICENSE",
              "licenses/tree-sitter-kotlin-ng-1.1.0-LICENSE",
              "licenses/tree-sitter-typescript-0.23.2-LICENSE",
              "package-manifest.json",
          }
          with zipfile.ZipFile(archive) as package:
              names = set(package.namelist())
          if not required <= names:
              raise SystemExit(f"release package lacks required notices: {required - names!r}")
          sha256 = archive.with_name(archive.name + ".sha256").read_text(
              encoding="utf-8"
          ).split("  ", 1)[0]
          if sha256 != hashlib.sha256(archive.read_bytes()).hexdigest():
              raise SystemExit("release package SHA-256 sidecar differs")
          blake3 = archive.with_name(archive.name + ".blake3").read_text(
              encoding="utf-8"
          ).split("  ", 1)[0]
          if not re.fullmatch(r"[0-9a-f]{64}", blake3):
              raise SystemExit("release package BLAKE3 sidecar is not canonical")
          lifecycle_path = Path(os.environ["LIFECYCLE"])
          lifecycle = json.loads(lifecycle_path.read_bytes())
          lifecycle_expected = {
              "baseline_archive": f"rootlight-0.0.0-{target}.zip",
              "baseline_version": "0.0.0",
              "candidate_archive": archive.name,
              "candidate_sha256": sha256,
              "candidate_target": target,
              "candidate_version": os.environ["VERSION"],
              "committed_active_version": os.environ["VERSION"],
              "committed_last_good_version": "0.0.0",
              "rollback_active_version": "0.0.0",
              "schema": "rootlight.package-lifecycle/1",
              "source_revision": os.environ["SOURCE_REVISION"],
          }
          if {
              key: lifecycle.get(key) for key in lifecycle_expected
          } != lifecycle_expected:
              raise SystemExit(f"release package lifecycle differs: {lifecycle!r}")
          observations = (
              "candidate_health_observed",
              "clean_recovery_observed",
              "failed_health_rollback_observed",
              "installed_command_uninstall_observed",
              "launcher_probe_observed",
              "unowned_data_preserved",
              "user_data_preserved",
          )
          if any(lifecycle.get(field) is not True for field in observations):
              raise SystemExit(f"release package lifecycle is incomplete: {lifecycle!r}")
          if lifecycle.get("bootstrap_owned_files", 0) < 1:
              raise SystemExit("release package bootstrap owned no files")
          if lifecycle.get("uninstall_removed_versions") != 2:
              raise SystemExit("release package uninstall did not remove both owned versions")
          lifecycle_sha256 = hashlib.sha256(lifecycle_path.read_bytes()).hexdigest()
          document = {
              "schema": "rootlight.release-package-candidate/1",
              "archive": archive.name,
              "blake3": blake3,
              "cargo_version": subprocess.check_output(
                  ["cargo", "--version"], text=True
              ).strip(),
              "independent_archives": "bit_identical",
              "independent_builds": "bit_identical",
              "lifecycle_report": lifecycle_path.name,
              "lifecycle_sha256": lifecycle_sha256,
              "runner": os.environ["RUNNER_LABEL"],
              "rustc_host": os.environ["RUSTC_HOST"],
              "rustc_version": subprocess.check_output(
                  ["rustc", "--version", "--verbose"], text=True
              ).strip(),
              "sha256": sha256,
              "source_revision": os.environ["SOURCE_REVISION"],
              "target": target,
              "version": os.environ["VERSION"],
          }
          (archive.parent / f"{target}.candidate.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootlight-release-candidate-${{ matrix.target }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-candidate-first
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false

  release-candidate-evidence:
    name: release package reproducibility / linux
    needs: [release-package-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Download exact candidate set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rootlight-release-candidate-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/release-candidates
          merge-multiple: true
      - name: Independently validate all native candidates
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          version="$(
            cargo metadata --locked --no-deps --format-version 1 |
              python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "rootlight"))'
          )"
          for target in \
            aarch64-apple-darwin \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            x86_64-pc-windows-msvc \
            x86_64-unknown-linux-gnu; do
            cargo run --locked --quiet --package xtask -- package-verify \
              --archive "artifacts/release-candidates/rootlight-$version-$target.zip"
          done
          VERSION="$version" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/release-candidates")
          targets = {
              "aarch64-apple-darwin",
              "aarch64-unknown-linux-gnu",
              "x86_64-apple-darwin",
              "x86_64-pc-windows-msvc",
              "x86_64-unknown-linux-gnu",
          }
          version = os.environ["VERSION"]
          expected = set()
          for target in targets:
              archive = f"rootlight-{version}-{target}.zip"
              expected |= {
                  archive,
                  f"{archive}.sha256",
                  f"{archive}.blake3",
                  f"{target}.candidate.json",
                  f"{target}.lifecycle.json",
              }
          observed = {path.name for path in root.iterdir()}
          if observed != expected:
              raise SystemExit(
                  f"release candidate artifact set differs: "
                  f"missing={sorted(expected - observed)!r}, "
                  f"extra={sorted(observed - expected)!r}"
              )
          for target in targets:
              document = json.loads(
                  (root / f"{target}.candidate.json").read_bytes()
              )
              archive = f"rootlight-{version}-{target}.zip"
              expected_fields = {
                  "archive": archive,
                  "independent_archives": "bit_identical",
                  "independent_builds": "bit_identical",
                  "lifecycle_report": f"{target}.lifecycle.json",
                  "rustc_host": target,
                  "schema": "rootlight.release-package-candidate/1",
                  "source_revision": os.environ["SOURCE_REVISION"],
                  "target": target,
                  "version": version,
              }
              observed_fields = {
                  key: document.get(key) for key in expected_fields
              }
              if observed_fields != expected_fields:
                  raise SystemExit(
                      f"{target} candidate record differs: {document!r}"
                  )
              lifecycle_path = root / f"{target}.lifecycle.json"
              lifecycle_bytes = lifecycle_path.read_bytes()
              lifecycle_sha256 = hashlib.sha256(lifecycle_bytes).hexdigest()
              if document.get("lifecycle_sha256") != lifecycle_sha256:
                  raise SystemExit(f"{target} lifecycle digest differs")
              lifecycle = json.loads(lifecycle_bytes)
              archive_sha256 = (
                  root / f"{archive}.sha256"
              ).read_text(encoding="utf-8").split("  ", 1)[0]
              lifecycle_expected = {
                  "baseline_archive": f"rootlight-0.0.0-{target}.zip",
                  "baseline_version": "0.0.0",
                  "candidate_archive": archive,
                  "candidate_sha256": archive_sha256,
                  "candidate_target": target,
                  "candidate_version": version,
                  "committed_active_version": version,
                  "committed_last_good_version": "0.0.0",
                  "rollback_active_version": "0.0.0",
                  "schema": "rootlight.package-lifecycle/1",
                  "source_revision": os.environ["SOURCE_REVISION"],
              }
              if {
                  key: lifecycle.get(key) for key in lifecycle_expected
              } != lifecycle_expected:
                  raise SystemExit(f"{target} lifecycle differs: {lifecycle!r}")
              observations = (
                  "candidate_health_observed",
                  "clean_recovery_observed",
                  "failed_health_rollback_observed",
                  "launcher_probe_observed",
                  "unowned_data_preserved",
                  "user_data_preserved",
              )
              if any(lifecycle.get(field) is not True for field in observations):
                  raise SystemExit(f"{target} lifecycle is incomplete: {lifecycle!r}")
              if lifecycle.get("bootstrap_owned_files", 0) < 1:
                  raise SystemExit(f"{target} bootstrap owned no files")
              if lifecycle.get("uninstall_removed_versions") != 2:
                  raise SystemExit(f"{target} uninstall did not remove both versions")
          PY
  durability-platform:
    name: durable catalog / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: windows
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust
        shell: bash
        run: rustup show active-toolchain
      - name: Exercise private storage and crash recovery
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.sha }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          cargo test --locked --package rootlight-vfs
          cargo test --locked --package rootlight-service durable_service_
          cargo test --locked --package rootlight-operations \
            authorized_publication_reconciles_only_with_external_commit_proof
          cargo test --locked --package rootlight-operations \
            interrupted_unprepared_work_cannot_be_reconciled_as_published
          cargo test --locked --package rootlight-daemon \
            durable_marker_reconciles_the_journal_after_publication_crash
          mkdir -p artifacts/durability-platform
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          platform = os.environ["TARGET_PLATFORM"]
          document = {
              "schema": "rootlight.durability-platform/1",
              "source_revision": os.environ["SOURCE_REVISION"],
              "platform": platform,
              "private_boundary": "passed",
              "durable_restore": "passed",
              "crash_reconciliation": "passed",
          }
          Path(f"artifacts/durability-platform/{platform}.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
      - name: Upload platform durability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootlight-durability-platform-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/durability-platform/${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
          include-hidden-files: false

  durability-evidence:
