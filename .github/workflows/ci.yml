# Every relevant revision must pass the complete release-quality validation set.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # GitHub retains only one pending run per group, so every push needs an
  # immutable group while superseded revisions of one pull request may cancel.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fast:
    name: fast / pinned / linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Restore exact Rust build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rootlight-ci-fast-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-all-features-debug-v1
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Architecture and contracts
        run: |
          cargo run --locked --quiet --package xtask -- architecture-check
          cargo run --locked --quiet --package xtask -- generate --check
          cargo run --locked --quiet --package xtask -- compatibility-check
          cargo run --locked --quiet --package xtask -- mcp-compatibility-check
          cargo run --locked --quiet --package xtask -- budget-conformance-check
          cargo run --locked --quiet --package xtask -- policy-check
          cargo run --locked --quiet --package xtask -- license-check
          cargo run --locked --quiet --package xtask -- package-check
          python scripts/test-validate-package-lifecycle.py
          python scripts/test_generate_release_sboms.py
          python scripts/test_orchestrate_release.py
          python scripts/test_prepare_npm_packages.py
          python scripts/test_publish_npm_packages.py
          python scripts/test_verify_installed_web.py
          python scripts/test_verify_npm_install.py
          node --check packaging/npm/rootlight.mjs
          node --check packaging/npm/rootlight-mcp.mjs
          node --check packaging/npm/run-native.mjs
          node scripts/test_npm_wrappers.mjs
          cargo run --locked --quiet --package xtask -- id-vectors > target/id-vectors.actual.json
          cmp tests/fixtures/id-vectors.json target/id-vectors.actual.json
      - name: Capability parity and evidence
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          mkdir -p target/capability-parity target/capability-parity-second
          cargo run --locked --quiet --package xtask -- capability-check \
            --output-dir target/capability-parity \
            --source-revision "$SOURCE_REVISION"
          cargo run --locked --quiet --package xtask -- capability-check \
            --output-dir target/capability-parity-second \
            --source-revision "$SOURCE_REVISION"
          diff --recursive target/capability-parity target/capability-parity-second
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("target/capability-parity")
          expected_files = {
              "capability-execution-matrix-v1.json",
              "capability-initial-mismatches-v1.json",
              "capability-parity-report-v1.json",
              "capability-registry-v1.json",
          }
          if {path.name for path in root.iterdir()} != expected_files:
              raise SystemExit("capability artifact set differs")

          revision = os.environ["SOURCE_REVISION"]
          report = json.loads(
              (root / "capability-parity-report-v1.json").read_bytes()
          )
          expected_report = {
              "schema": "rootlight.mcp-capability-parity/1",
              "sourceRevision": revision,
              "status": "passed",
              "toolCount": 19,
              "reviewedInputFields": 565,
              "schemaGoldenPairs": 19,
              "profileCounts": {
                  "scout": 6,
                  "analysis": 13,
                  "developer": 19,
              },
              "blockedGaps": 0,
          }
          if report != expected_report:
              raise SystemExit(f"capability parity report differs: {report!r}")

          registry = json.loads(
              (root / "capability-registry-v1.json").read_bytes()
          )
          if (
              registry.get("schema") != "rootlight.mcp-capability-registry/1"
              or registry.get("sourceRevision") != revision
              or len(registry.get("tools", [])) != 19
          ):
              raise SystemExit("capability registry artifact differs")

          matrix = json.loads(
              (root / "capability-execution-matrix-v1.json").read_bytes()
          )
          cases = matrix.get("cases")
          if (
              matrix.get("schema") != "rootlight.mcp-execution-matrix/1"
              or matrix.get("sourceRevision") != revision
              or not isinstance(cases, list)
              or not cases
              or any(
                  case.get("observation") != "not_run"
                  or case.get("verdict") != "unknown"
                  for case in cases
              )
          ):
              raise SystemExit("execution matrix overstates observed behavior")

          encoded = b"".join(path.read_bytes() for path in sorted(root.iterdir()))
          if str(Path.cwd()).encode() in encoded:
              raise SystemExit("capability artifacts contain the checkout path")
          PY
      - name: Verify support-bundle privacy
        run: |
          cargo test --locked --package rootlight-observability --lib \
            tests::support_archive_is_deterministic_and_allow_listed -- --exact
          cargo test --locked --package rootlight-observability --lib \
            tests::support_archive_never_accepts_arbitrary_sensitive_payloads -- --exact
          cargo test --locked --package rootlight-client --lib \
            tests::support_bundle_decoder_enforces_privacy_size_digest_and_shape -- --exact
          cargo test --locked --package rootlight-daemon-core --lib \
            tests::diagnostics_and_support_bundle_are_source_free_and_wire_stable -- --exact
      - name: Clean generated tree
        run: git diff --exit-code

  web-build:
    name: web-build / pinned and offline / linux
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/rootlight-web/frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Node.js and npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: apps/rootlight-web/frontend/package-lock.json
          package-manager-cache: false
      - name: Verify exact web toolchain
        run: |
          test "$(node --version)" = "v24.11.1"
          test "$(npm --version)" = "11.6.2"
      - name: Install and validate the locked web dependency graph
        run: |
          npm ci --ignore-scripts
          npm run release:dependencies
          npm audit --omit=dev --audit-level=high
      - name: Build and verify target-neutral web assets
        env:
          RELEASE_VERSION: 0.0.0
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          npm run check
          mkdir -p "$GITHUB_WORKSPACE/artifacts/web-release/dist"
          cp -R dist/. "$GITHUB_WORKSPACE/artifacts/web-release/dist/"
          npm run release:notices -- \
            --output "$GITHUB_WORKSPACE/artifacts/web-release/rootlight-web-third-party-notices.txt"
          npm run release:verify -- \
            --assets-dir dist \
            --notices "$GITHUB_WORKSPACE/artifacts/web-release/rootlight-web-third-party-notices.txt" \
            --npm-version 11.6.2 \
            --output "$GITHUB_WORKSPACE/artifacts/web-release/web-release.json" \
            --source-revision "$SOURCE_REVISION" \
            --version "$RELEASE_VERSION"
          rm -rf dist
          npm run build
          diff --recursive \
            "$GITHUB_WORKSPACE/artifacts/web-release/dist" \
            dist
      - name: Reinstall and rebuild from the prepared offline npm cache
        env:
          RELEASE_VERSION: 0.0.0
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          rm -rf node_modules dist
          npm ci --ignore-scripts --offline
          npm run build
          npm run release:notices -- \
            --output "$GITHUB_WORKSPACE/artifacts/web-release/rootlight-web-third-party-notices-offline.txt"
          npm run release:verify -- \
            --assets-dir dist \
            --notices "$GITHUB_WORKSPACE/artifacts/web-release/rootlight-web-third-party-notices-offline.txt" \
            --npm-version 11.6.2 \
            --output "$GITHUB_WORKSPACE/artifacts/web-release/web-release-offline.json" \
            --source-revision "$SOURCE_REVISION" \
            --version "$RELEASE_VERSION"
          diff --recursive \
            "$GITHUB_WORKSPACE/artifacts/web-release/dist" \
            dist
          cmp \
            "$GITHUB_WORKSPACE/artifacts/web-release/rootlight-web-third-party-notices.txt" \
            "$GITHUB_WORKSPACE/artifacts/web-release/rootlight-web-third-party-notices-offline.txt"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "artifacts" / "web-release"
          first = json.loads((root / "web-release.json").read_bytes())
          offline = json.loads((root / "web-release-offline.json").read_bytes())
          ignored = {"ignored_optional_install_scripts"}
          if {
              key: value for key, value in first.items() if key not in ignored
          } != {
              key: value for key, value in offline.items() if key not in ignored
          }:
              raise SystemExit("offline web release evidence differs")
          if (
              first.get("asset_manifest_sha256")
              != offline.get("asset_manifest_sha256")
              or first.get("notice_sha256") != offline.get("notice_sha256")
          ):
              raise SystemExit("offline web release hashes differ")
          PY
          rm \
            "$GITHUB_WORKSPACE/artifacts/web-release/rootlight-web-third-party-notices-offline.txt" \
            "$GITHUB_WORKSPACE/artifacts/web-release/web-release-offline.json"
      - name: Upload immutable target-neutral web release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootlight-web-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/web-release
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false

  web-e2e:
    name: web-e2e / browser quality matrix / linux
    needs: [web-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/rootlight-web/frontend
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Node.js and npm
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.1
          cache: npm
          cache-dependency-path: apps/rootlight-web/frontend/package-lock.json
          package-manager-cache: false
      - name: Run browser acceptance, accessibility, performance, and fallback tests
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          test "$(node --version)" = "v24.11.1"
          test "$(npm --version)" = "11.6.2"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e
      - name: Upload source-free browser quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootlight-web-browser-quality-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: apps/rootlight-web/frontend/test-results/**/web-*.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: false
          include-hidden-files: false

  msrv:
    name: msrv / 1.90.0 / linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install MSRV
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
          test "$(rustc --version)" = "$(rustup run 1.90.0 rustc --version)"
      - name: Restore exact MSRV build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rootlight-ci-msrv-${{ runner.os }}-${{ runner.arch }}-1.90.0-${{ hashFiles('Cargo.lock') }}-all-features-debug-v1
      - name: MSRV quality suite
        run: |
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo run --locked --quiet --package xtask -- architecture-check
          cargo run --locked --quiet --package xtask -- generate --check
          cargo run --locked --quiet --package xtask -- compatibility-check
          cargo run --locked --quiet --package xtask -- mcp-compatibility-check
          cargo run --locked --quiet --package xtask -- policy-check

  current-stable:
    name: current stable / linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          test "$(rustc --version)" = "$(rustup run stable rustc --version)"
      - name: Bind cache to the resolved current-stable compiler
        id: current-stable-toolchain
        run: echo "rustc=$(rustc --version | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore exact current-stable build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rootlight-ci-current-stable-${{ runner.os }}-${{ runner.arch }}-${{ steps.current-stable-toolchain.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}-all-features-debug-v1
      - name: Current-stable quality canary
        run: |
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked

  platform:
    name: platform / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: rustup show active-toolchain
      - name: Restore exact platform build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rootlight-ci-platform-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-all-features-debug-v1
      - name: Compile the native Seatbelt profile
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          cargo test --locked --package rootlight-sandbox --lib
          platform::unix::tests::macos_profile_compiles_in_fresh_process
          -- --exact --nocapture --test-threads=1
      - name: Platform contract suite
        shell: bash
        run: |
          cargo check --workspace --all-targets --all-features --locked
          cargo test --workspace --all-features --locked
          cargo run --locked --quiet --package xtask -- architecture-check
          cargo run --locked --quiet --package xtask -- generate --check
          cargo run --locked --quiet --package xtask -- compatibility-check
          cargo run --locked --quiet --package xtask -- policy-check
          cargo run --locked --quiet --package xtask -- id-vectors > target/id-vectors.actual.json
      - name: Durable workspace scale contract
        shell: bash
        run: >-
          cargo test --locked --package rootlight-bench
          workspace_scale::tests::one_repository_exercises_durable_restart_and_isolation
          -- --ignored --exact --test-threads=1
      - name: Compare identifier vectors
        shell: pwsh
        run: |
          $expected = (Get-Content tests/fixtures/id-vectors.json -Raw).Replace("`r`n", "`n")
          $actual = (Get-Content target/id-vectors.actual.json -Raw).Replace("`r`n", "`n")
          if ($actual -cne $expected) {
            throw "identifier vectors differ from the committed fixture"
          }
      - name: Clean generated tree
        shell: bash
        run: git diff --exit-code

  daemon-lifecycle:
    name: daemon lifecycle / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: rustup show active-toolchain
      - name: Restore exact daemon lifecycle build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rootlight-ci-daemon-lifecycle-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-debug-v1
      - name: Build lifecycle binaries
        shell: bash
        run: cargo build --locked --package rootlight --package rootlight-daemon --package xtask
      - name: Exercise startup, control, recovery, and shutdown
        shell: bash
        run: cargo run --locked --quiet --package xtask -- daemon-lifecycle-check --bin-dir target/debug

  vertical-slice:
    name: vertical slice / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: rustup show active-toolchain
      - name: Restore exact vertical-slice build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rootlight-ci-vertical-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-debug-v1
      - name: Build vertical-slice binaries
        shell: bash
        run: cargo build --locked --package rootlight-daemon --package rootlight-mcp --package xtask
      - name: Run vertical-slice integration check
        shell: bash
        run: cargo run --locked --quiet --package xtask -- mcp-vertical-check --bin-dir target/debug --output-dir artifacts/vertical-slice/${{ matrix.os }}
      - name: Upload vertical-slice evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vertical-slice-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/vertical-slice/${{ matrix.os }}/summary.json
            artifacts/vertical-slice/${{ matrix.os }}/transcript.jsonl
            artifacts/vertical-slice/${{ matrix.os }}/failure.json
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
          overwrite: false

  durability-platform:
    name: durable catalog / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2025
            platform: windows
          - os: macos-15
            platform: macos-aarch64
          - os: macos-15-intel
            platform: macos-x86_64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust
        shell: bash
        run: rustup show active-toolchain
      - name: Restore exact durability build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rootlight-ci-durability-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-debug-v1
      - name: Exercise private storage and crash recovery
        shell: bash
        env:
          SOURCE_REVISION: ${{ github.sha }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          cargo test --locked --package rootlight-vfs
          cargo test --locked --package rootlight-service durable_service_
          cargo test --locked --package rootlight-operations \
            authorized_publication_reconciles_only_with_external_commit_proof
          cargo test --locked --package rootlight-operations \
            interrupted_unprepared_work_cannot_be_reconciled_as_published
          cargo test --locked --package rootlight-daemon \
            durable_marker_reconciles_the_journal_after_publication_crash
          mkdir -p artifacts/durability-platform
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          platform = os.environ["TARGET_PLATFORM"]
          document = {
              "schema": "rootlight.durability-platform/1",
              "source_revision": os.environ["SOURCE_REVISION"],
              "platform": platform,
              "private_boundary": "passed",
              "durable_restore": "passed",
              "crash_reconciliation": "passed",
          }
          Path(f"artifacts/durability-platform/{platform}.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
              newline="\n",
          )
          PY
      - name: Upload platform durability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootlight-durability-platform-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/durability-platform/${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 1
          overwrite: false
          include-hidden-files: false

  durability-evidence:
    name: durability evidence / linux
    needs: [durability-platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Download cross-platform durability results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rootlight-durability-platform-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/durability-platform
          merge-multiple: true
      - name: Validate platform results and restart lineage
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/durability-platform")
          expected_platforms = {
              "linux",
              "macos-aarch64",
              "macos-x86_64",
              "windows",
          }
          if {path.stem for path in root.iterdir()} != expected_platforms:
              raise SystemExit("cross-platform durability artifact set differs")
          for platform in sorted(expected_platforms):
              document = json.loads((root / f"{platform}.json").read_bytes())
              expected = {
                  "schema": "rootlight.durability-platform/1",
                  "source_revision": os.environ["SOURCE_REVISION"],
                  "platform": platform,
                  "private_boundary": "passed",
                  "durable_restore": "passed",
                  "crash_reconciliation": "passed",
              }
              if document != expected:
                  raise SystemExit(
                      f"{platform} durability evidence differs: {document!r}"
                  )
          PY
          cargo test --locked --package rootlight-mcp \
            --test repository_lifecycle_process \
            repository_generation_and_source_queries_survive_daemon_restart -- --exact
          cargo test --locked --package rootlight-operations \
            version_two_schema_rejects_tampered_ledger_and_definition
          cargo test --locked --package rootlight-catalog \
            undeclared_migration_is_rejected

