        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          SIGNING_RESULT: ${{ needs.release-signing.result }}
        run: |
          python - <<'PY'
          import os

          expected = (
              "success"
              if os.environ["EVENT_NAME"] == "push"
              and os.environ["EVENT_REF"] == "refs/heads/main"
              else "skipped"
          )
          observed = os.environ["SIGNING_RESULT"]
          if observed != expected:
              raise SystemExit(
                  f"release signing result differs: expected={expected}, "
                  f"observed={observed}"
              )
          PY
