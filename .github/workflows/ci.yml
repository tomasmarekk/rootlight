name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  fast:
    name: fast / pinned / linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Restore exact Rust build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rootlight-ci-fast-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-all-features-debug-v1
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-features --locked
      - name: Architecture and contracts
        run: |
          cargo run --locked --quiet --package xtask -- architecture-check
          cargo run --locked --quiet --package xtask -- generate --check
          cargo run --locked --quiet --package xtask -- compatibility-check
          cargo run --locked --quiet --package xtask -- mcp-compatibility-check
          cargo run --locked --quiet --package xtask -- budget-conformance-check
          cargo run --locked --quiet --package xtask -- policy-check
          cargo run --locked --quiet --package xtask -- license-check
          cargo run --locked --quiet --package xtask -- package-check
          python scripts/test-validate-package-lifecycle.py
          python scripts/test_orchestrate_release.py
          python scripts/test_prepare_npm_packages.py
          python scripts/test_publish_npm_packages.py
          node --check packaging/npm/rootlight.mjs
          cargo run --locked --quiet --package xtask -- id-vectors > target/id-vectors.actual.json
          cmp tests/fixtures/id-vectors.json target/id-vectors.actual.json
      - name: Capability parity and evidence
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          mkdir -p target/capability-parity target/capability-parity-second
          cargo run --locked --quiet --package xtask -- capability-check \
            --output-dir target/capability-parity \
            --source-revision "$SOURCE_REVISION"
          cargo run --locked --quiet --package xtask -- capability-check \
            --output-dir target/capability-parity-second \
            --source-revision "$SOURCE_REVISION"
          diff --recursive target/capability-parity target/capability-parity-second
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("target/capability-parity")
          expected_files = {
              "capability-execution-matrix-v1.json",
              "capability-initial-mismatches-v1.json",
              "capability-parity-report-v1.json",
              "capability-registry-v1.json",
          }
          if {path.name for path in root.iterdir()} != expected_files:
              raise SystemExit("capability artifact set differs")

          revision = os.environ["SOURCE_REVISION"]
          report = json.loads(
              (root / "capability-parity-report-v1.json").read_bytes()
          )
          expected_report = {
              "schema": "rootlight.mcp-capability-parity/1",
              "sourceRevision": revision,
              "status": "passed",
              "toolCount": 19,
              "reviewedInputFields": 565,
              "schemaGoldenPairs": 19,
              "profileCounts": {
                  "scout": 6,
                  "analysis": 13,
                  "developer": 19,
              },
              "blockedGaps": 0,
          }
          if report != expected_report:
              raise SystemExit(f"capability parity report differs: {report!r}")

          registry = json.loads(
              (root / "capability-registry-v1.json").read_bytes()
          )
          if (
              registry.get("schema") != "rootlight.mcp-capability-registry/1"
              or registry.get("sourceRevision") != revision
              or len(registry.get("tools", [])) != 19
          ):
              raise SystemExit("capability registry artifact differs")

          matrix = json.loads(
              (root / "capability-execution-matrix-v1.json").read_bytes()
          )
          cases = matrix.get("cases")
          if (
              matrix.get("schema") != "rootlight.mcp-execution-matrix/1"
              or matrix.get("sourceRevision") != revision
              or not isinstance(cases, list)
              or not cases
              or any(
                  case.get("observation") != "not_run"
                  or case.get("verdict") != "unknown"
                  for case in cases
              )
          ):
              raise SystemExit("execution matrix overstates observed behavior")

          encoded = b"".join(path.read_bytes() for path in sorted(root.iterdir()))
          if str(Path.cwd()).encode() in encoded:
              raise SystemExit("capability artifacts contain the checkout path")
          PY
      - name: Daemon lifecycle
        run: |
          cargo build --locked --package rootlight --package rootlight-daemon --package xtask
          cargo run --locked --quiet --package xtask -- daemon-lifecycle-check --bin-dir target/debug
      - name: Verify support-bundle privacy
        run: |
          cargo test --locked --package rootlight-observability --lib \
            tests::support_archive_is_deterministic_and_allow_listed -- --exact
          cargo test --locked --package rootlight-observability --lib \
            tests::support_archive_never_accepts_arbitrary_sensitive_payloads -- --exact
          cargo test --locked --package rootlight-client --lib \
            tests::support_bundle_decoder_enforces_privacy_size_digest_and_shape -- --exact
          cargo test --locked --package rootlight-daemon-core --lib \
            tests::diagnostics_and_support_bundle_are_source_free_and_wire_stable -- --exact
      - name: Clean generated tree
        run: git diff --exit-code

  msrv:
    name: msrv / 1.90.0 / linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install MSRV
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component clippy,rustfmt
          test "$(rustc --version)" = "$(rustup run 1.90.0 rustc --version)"
      - name: Restore exact MSRV build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rootlight-ci-msrv-${{ runner.os }}-${{ runner.arch }}-1.90.0-${{ hashFiles('Cargo.lock') }}-all-features-debug-v1
      - name: MSRV quality suite
        run: |
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-features --locked
          cargo run --locked --quiet --package xtask -- architecture-check
          cargo run --locked --quiet --package xtask -- generate --check
          cargo run --locked --quiet --package xtask -- compatibility-check
          cargo run --locked --quiet --package xtask -- mcp-compatibility-check
          cargo run --locked --quiet --package xtask -- policy-check

  current-stable:
    name: current stable / linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install current stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          test "$(rustc --version)" = "$(rustup run stable rustc --version)"
      - name: Bind cache to the resolved current-stable compiler
        id: current-stable-toolchain
        run: echo "rustc=$(rustc --version | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore exact current-stable build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rootlight-ci-current-stable-${{ runner.os }}-${{ runner.arch }}-${{ steps.current-stable-toolchain.outputs.rustc }}-${{ hashFiles('Cargo.lock') }}-all-features-debug-v1
      - name: Current-stable quality canary
        run: |
          cargo check --workspace --all-targets --all-features --locked
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  platform:
    name: platform / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust
        shell: bash
        run: rustup show active-toolchain
      - name: Restore exact platform build inputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rootlight-ci-platform-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-os-smoke-debug-v1
      - name: Exercise OS-sensitive contracts
        shell: bash
        run: |
          cargo test --locked \
            --package rootlight-client \
            --package rootlight-ipc \
            --package rootlight-launcher \
            --package rootlight-sandbox \
            --package rootlight-vfs
          cargo run --locked --quiet --package xtask -- id-vectors > target/id-vectors.actual.json
      - name: Daemon lifecycle
        shell: bash
        run: |
          cargo build --locked --package rootlight --package rootlight-daemon --package xtask
          cargo run --locked --quiet --package xtask -- daemon-lifecycle-check --bin-dir target/debug
      - name: Compare identifier vectors
        shell: pwsh
        run: |
          $expected = (Get-Content tests/fixtures/id-vectors.json -Raw).Replace("`r`n", "`n")
          $actual = (Get-Content target/id-vectors.actual.json -Raw).Replace("`r`n", "`n")
          if ($actual -cne $expected) {
            throw "identifier vectors differ from the committed fixture"
          }
      - name: Clean generated tree
        shell: bash
        run: git diff --exit-code

  supply-chain:
    name: supply chain smoke / linux
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Restore checksum-bound policy tools and Cargo inputs
        # The installer remeasures cached tools; compiled targets stay outside this security boundary.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/bin
          key: rootlight-policy-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'scripts/install-policy-tools.sh', 'scripts/install-*.sh', 'scripts/*.lock', 'scripts/*.patch', 'policy/toolchain.toml', 'Cargo.lock') }}-v1
      - name: Install checksum-verified policy tools
        run: bash scripts/install-policy-tools.sh "$HOME/.local/bin"
      - name: Acquire current advisory inputs
        run: |
          cargo fetch --locked
          bash scripts/download-rustsec-database.sh artifacts/rustsec-db
          bash scripts/download-osv-database.sh artifacts/osv-db
      - name: Enforce dependency, license, source, and advisory policy
        run: |
          cargo deny check bans licenses sources
          cargo audit --db artifacts/rustsec-db --no-fetch -D warnings
          OSV_SCANNER_LOCAL_DB_CACHE_DIRECTORY="$PWD/artifacts/osv-db" \
            osv-scanner scan source --offline --format json --lockfile Cargo.lock \
            > artifacts/osv-report.json
          cargo run --locked --quiet --package xtask -- policy-check
          cargo run --locked --quiet --package xtask -- license-check
      - name: Scan secrets
        run: gitleaks git --redact=100 --no-banner --no-color --log-level warn .
      - name: Exercise security negative controls
        run: bash scripts/policy-negative-controls.sh

  ci-required:
    name: ci-required
    if: always()
    needs: [fast, msrv, current-stable, platform, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every merge gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          failed = {
              name: result.get("result")
              for name, result in json.loads(os.environ["NEEDS_JSON"]).items()
              if result.get("result") != "success"
          }
          if failed:
              print(f"required CI jobs did not succeed: {failed}", file=sys.stderr)
              raise SystemExit(1)
          print("all required correctness and security-smoke jobs succeeded")
          PY
