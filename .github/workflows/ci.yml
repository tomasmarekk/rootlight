  semantic-evidence:
    name: in-process Tier B semantic holdout / linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Generate deterministic in-process semantic holdout
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          cargo build --locked --release --package rootlight-bench --bin semantic-evidence
          target/release/semantic-evidence \
            --source-revision "$SOURCE_REVISION" > target/rootlight-semantic-evidence-v2.json
          target/release/semantic-evidence \
            --source-revision "$SOURCE_REVISION" > target/rootlight-semantic-evidence-v2.second.json
          cmp target/rootlight-semantic-evidence-v2.json target/rootlight-semantic-evidence-v2.second.json
          if grep --fixed-strings --binary-files=without-match "$PWD" \
            target/rootlight-semantic-evidence-v2.json; then
            echo "semantic evidence contains the checkout path" >&2
            exit 1
          fi
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          path = Path("target/rootlight-semantic-evidence-v2.json")
          encoded = path.read_bytes()
          envelope = json.loads(encoded)
          expected_envelope = {
              "schema": "rootlight.project-semantic-holdout-envelope/1",
              "source_revision": os.environ["SOURCE_REVISION"],
          }
          observed_envelope = {
              key: envelope.get(key) for key in expected_envelope
          }
          if observed_envelope != expected_envelope:
              raise SystemExit(
                  f"semantic evidence envelope mismatch: {observed_envelope!r}"
              )

          evidence = envelope.get("evidence")
          if not isinstance(evidence, dict):
              raise SystemExit("semantic evidence payload is missing")
          expected_evidence = {
              "schema": "rootlight.project-semantic-holdout/2",
              "corpus_id": "rootlight-project-semantic-holdout-v1",
              "analyzer": "rootlight-project-semantics",
              "parser": "rootlight-audited-tree-sitter",
              "execution_path": "in_process_analyzer",
              "observed_tier": "tier_b",
              "compiler_assisted_observed": False,
              "compiler_build_context_observed": False,
              "holdout_available": True,
              "language_breakdown_available": True,
          }
          observed_evidence = {
              key: evidence.get(key) for key in expected_evidence
          }
          if observed_evidence != expected_evidence:
              raise SystemExit(
                  f"semantic evidence payload mismatch: {observed_evidence!r}"
              )

          languages = evidence.get("languages")
          expected_languages = [
              "rust",
              "typescript",
              "javascript",
              "python",
              "go",
          ]
          if not isinstance(languages, list):
              raise SystemExit("semantic language evidence is missing")
          if [item.get("language") for item in languages] != expected_languages:
              raise SystemExit("semantic language evidence differs")
          for item in languages:
              expected_counts = {
                  "source_files": 3,
                  "annotated_call_sites": 12,
                  "observed_annotated_call_sites": 12,
                  "exact_expected": 8,
                  "ambiguous_expected": 2,
                  "unresolved_expected": 2,
                  "unresolved_correct": 2,
                  "ambiguous_hidden_exact": 0,
                  "unexpected_decisions": 0,
                  "calibration_samples": 10,
              }
              if any(item.get(key) != value for key, value in expected_counts.items()):
                  raise SystemExit(
                      f"semantic category evidence differs: {item!r}"
                  )
              if (
                  item.get("observed_tier") != "tier_b"
                  or item.get("compiler_assisted_observed") is not False
                  or item.get("exact_precision_basis_points", 0) < 9500
                  or item.get("exact_recall_basis_points", 0) < 9000
                  or item.get("candidate_recall_basis_points", 0) < 9000
                  or item.get("expected_calibration_error_milli", 1001) > 400
                  or not all(item.get(field) is True for field in (
                      "analysis_coverage_complete",
                      "build_context_identity_bound",
                      "provenance_complete",
                      "repeated_output_identical",
                  ))
              ):
                  raise SystemExit(
                      f"semantic Tier B behavior differs: {item!r}"
                  )
              capabilities = item.get("capabilities")
              expected_capabilities = {
                  "import_edges": 2,
                  "signatures": 2,
                  "type_entities": 2,
                  "hierarchy_relations": 1,
                  "visibility": 2,
                  "inferred_calls": 12,
                  "dispatch_candidates": 2,
              }
              if not isinstance(capabilities, dict):
                  raise SystemExit("semantic capability scores are missing")
              for capability, expected in expected_capabilities.items():
                  score = capabilities.get(capability)
                  if score != {
                      "expected": expected,
                      "observed": expected,
                      "correct": expected,
                  }:
                      raise SystemExit(
                          f"semantic capability score differs: "
                          f"{capability}={score!r}"
                      )

          aggregate = evidence.get("aggregate")
          if not isinstance(aggregate, dict):
              raise SystemExit("semantic aggregate evidence is missing")
          expected_aggregate = {
              "annotated_call_sites": 60,
              "observed_annotated_call_sites": 60,
              "exact_expected": 40,
              "ambiguous_expected": 10,
              "unresolved_expected": 10,
              "unresolved_correct": 10,
              "ambiguous_hidden_exact": 0,
              "unexpected_decisions": 0,
              "calibration_samples": 50,
          }
          if any(aggregate.get(key) != value for key, value in expected_aggregate.items()):
              raise SystemExit("semantic aggregate category evidence differs")
          if (
              aggregate.get("exact_precision_basis_points", 0) < 9500
              or aggregate.get("exact_recall_basis_points", 0) < 9000
              or aggregate.get("candidate_recall_basis_points", 0) < 9000
              or aggregate.get("maximum_expected_calibration_error_milli", 1001) > 400
          ):
              raise SystemExit("semantic aggregate quality evidence differs")
          expected_corpus_sha256 = (
              "c5d11cf027df0f588bc98a4cd4e168bf"
              "531b395d34fe19685d8f20ec6666f004"
          )
          if evidence.get("corpus_sha256") != expected_corpus_sha256:
              raise SystemExit("semantic corpus digest differs")
          if '"observed_tier":"tier_a"' in encoded.decode() or \
                  '"compiler_assisted_observed":true' in encoded.decode():
              raise SystemExit("semantic holdout overstates Tier A capability")
          if len(encoded) > 64 * 1024:
              raise SystemExit("semantic evidence exceeds its single-file ceiling")
          print(
              "verified in-process Tier B semantic holdout "
              f"bytes={len(encoded)} sha256={hashlib.sha256(encoded).hexdigest()}"
          )
          PY
      - name: Upload immutable semantic holdout envelope
        if: failure()
        id: evidence-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rootlight-semantic-evidence-v2-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/rootlight-semantic-evidence-v2.json
          if-no-files-found: warn
          retention-days: 7
          overwrite: false
          include-hidden-files: false
      - name: Record immutable artifact identity
        if: failure()
        env:
          ARTIFACT_ID: ${{ steps.evidence-upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.evidence-upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.evidence-upload.outputs.artifact-digest }}
        run: |
          {
            echo "### In-process Tier B semantic holdout"
            echo
            echo "- artifact id: \`$ARTIFACT_ID\`"
            echo "- artifact url: $ARTIFACT_URL"
            echo "- artifact digest: \`$ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

