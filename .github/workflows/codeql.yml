# CodeQL is an independent required security gate for the current revision.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions: {}

concurrency:
  # Release runners from superseded revisions of the same branch or pull request.
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-upload:
    name: analyze and upload / ${{ matrix.language }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Reserve post-action time to retain diagnostics after JavaScript evaluation.
    timeout-minutes: ${{ matrix.language == 'javascript-typescript' && 190 || 180 }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Initialize CodeQL
        if: matrix.language == 'rust'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Initialize JavaScript CodeQL diagnostics
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          debug: true
          db-location: ${{ runner.temp }}/codeql_databases
      - name: Analyze
        if: matrix.language == 'rust'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
      - name: Analyze JavaScript with evaluator diagnostics
        if: matrix.language == 'javascript-typescript'
        timeout-minutes: 180
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        env:
          # The Init post action retains files in the database log directory.
          CODEQL_ACTION_EXTRA_OPTIONS: >-
            {"database":{"run-queries":[
              "--evaluator-log=${{ runner.temp }}/codeql_databases/javascript/log/evaluator.jsonl",
              "--evaluator-log-minify"
            ]}}
        with:
          category: /language:${{ matrix.language }}
          threads: '2'

  analyze-pull-request:
    name: analyze pull request / ${{ matrix.language }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # Keep pull-request coverage and its runtime budget equal to main analyses.
    timeout-minutes: ${{ matrix.language == 'javascript-typescript' && 190 || 180 }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Initialize CodeQL
        if: matrix.language == 'rust'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - name: Initialize JavaScript CodeQL diagnostics
        if: matrix.language == 'javascript-typescript'
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          debug: true
          db-location: ${{ runner.temp }}/codeql_databases
      - name: Analyze without privileged upload
        if: matrix.language == 'rust'
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
          upload: never
          upload-database: false
      - name: Analyze JavaScript with evaluator diagnostics without privileged upload
        if: matrix.language == 'javascript-typescript'
        timeout-minutes: 180
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        env:
          # The Init post action retains files in the database log directory.
          CODEQL_ACTION_EXTRA_OPTIONS: >-
            {"database":{"run-queries":[
              "--evaluator-log=${{ runner.temp }}/codeql_databases/javascript/log/evaluator.jsonl",
              "--evaluator-log-minify"
            ]}}
        with:
          category: /language:${{ matrix.language }}
          threads: '2'
          upload: never
          upload-database: false

  codeql-required:
    name: codeql-required
    if: always()
    needs: [analyze-upload, analyze-pull-request]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CodeQL language analysis
        env:
          PULL_REQUEST_RESULT: ${{ needs.analyze-pull-request.result }}
          UPLOAD_RESULT: ${{ needs.analyze-upload.result }}
        run: |
          if { [ "$UPLOAD_RESULT" = "success" ] && [ "$PULL_REQUEST_RESULT" = "skipped" ]; } ||
             { [ "$UPLOAD_RESULT" = "skipped" ] && [ "$PULL_REQUEST_RESULT" = "success" ]; }; then
            echo "all required CodeQL analyses succeeded"
          else
            echo "required CodeQL analyses did not succeed: upload=$UPLOAD_RESULT pull_request=$PULL_REQUEST_RESULT" >&2
            exit 1
          fi
