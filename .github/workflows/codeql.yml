# Analyze all maintained source on every change without unpacked upstream archives.
# The independent weekly CodeQL Full workflow retains complete repository coverage.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-upload:
    name: analyze / ${{ matrix.language }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Acquire authenticated scanner prerequisite
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          if [ "$LANGUAGE" = "rust" ]; then
            bash scripts/setup-codeql-rust.sh "$RUNNER_TEMP/codeql-tools"
          else
            bash scripts/setup-codeql-javascript.sh "$RUNNER_TEMP/codeql-tools"
          fi
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          tools: ${{ env.CODEQL_BUNDLE }}
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/source.yml
      - name: Analyze maintained source
        timeout-minutes: 20
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: never
          upload-database: false
      - name: Retain successful results before upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 7
      - name: Upload and require processed results
        timeout-minutes: 5
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: ${{ runner.temp }}/codeql-results
          category: /language:${{ matrix.language }}
          sha: ${{ github.sha }}
          ref: ${{ github.ref }}
          wait-for-processing: true

  analyze-pull-request:
    name: analyze pull request / ${{ matrix.language }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Acquire authenticated scanner prerequisite
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          if [ "$LANGUAGE" = "rust" ]; then
            bash scripts/setup-codeql-rust.sh "$RUNNER_TEMP/codeql-tools"
          else
            bash scripts/setup-codeql-javascript.sh "$RUNNER_TEMP/codeql-tools"
          fi
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          tools: ${{ env.CODEQL_BUNDLE }}
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/source.yml
      - name: Analyze pull request without privileged upload
        timeout-minutes: 20
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:${{ matrix.language }}
          output: ${{ runner.temp }}/codeql-results
          upload: never
          upload-database: false
      - name: Retain pull request analysis
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-pr-${{ matrix.language }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/codeql-results/*.sarif
          if-no-files-found: error
          retention-days: 7

  codeql-required:
    name: codeql-required
    if: ${{ always() && !cancelled() }}
    needs: [analyze-upload, analyze-pull-request]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful analyses for both languages
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPLOAD_RESULT: ${{ needs.analyze-upload.result }}
          PULL_REQUEST_RESULT: ${{ needs.analyze-pull-request.result }}
        run: |
          if { [ "$EVENT_NAME" != "pull_request" ] && [ "$UPLOAD_RESULT" = "success" ] &&
               [ "$PULL_REQUEST_RESULT" = "skipped" ]; } ||
             { [ "$EVENT_NAME" = "pull_request" ] && [ "$UPLOAD_RESULT" = "skipped" ] &&
               [ "$PULL_REQUEST_RESULT" = "success" ]; }; then
            echo "both required CodeQL language analyses succeeded"
          else
            echo "required CodeQL analyses failed: upload=$UPLOAD_RESULT pull_request=$PULL_REQUEST_RESULT" >&2
            exit 1
          fi
