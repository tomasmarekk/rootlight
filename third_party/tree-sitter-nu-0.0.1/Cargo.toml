# Local static binding for the retained MIT Nushell grammar.
# Source preparation is separate; builds never acquire or generate code.
[package]
name = "tree-sitter-nu"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/nushell/tree-sitter-nu"
description = "Pinned Nushell grammar with local static language binding"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"
