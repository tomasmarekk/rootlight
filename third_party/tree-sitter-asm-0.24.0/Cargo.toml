# Local unpublished binding for pinned, locally patched MIT Assembly sources.
# Compilation uses retained static inputs; no acquisition or generation occurs.
[package]
name = "tree-sitter-asm"
version = "0.24.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/RubixDev/tree-sitter-asm"
description = "Pinned Assembly grammar with a local static language binding"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"
