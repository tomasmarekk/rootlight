[package]
name = "tree-sitter-ada"
version = "0.9.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Pinned Ada grammar with a local static binding"
repository = "https://github.com/briot/tree-sitter-ada"
build = "bindings/rust/build.rs"
publish = false

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"

[dev-dependencies]
tree-sitter = "=0.26.11"
