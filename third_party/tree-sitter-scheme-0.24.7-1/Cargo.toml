# Local static binding for the authenticated default Scheme parser.
# Original upstream manifests remain inert under upstream/, unchanged.
[package]
name = "tree-sitter-scheme-native-local"
version = "0.24.7-1"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT"
build = "build.rs"

[lib]
path = "lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"
