name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    shell: sh

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  npm:
    needs: ci
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify tag matches package version
        run: |
          package_version=$(node --input-type=module --eval 'import metadata from "./package.json" with { type: "json" }; console.log(metadata.version);')
          readonly package_version
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm publish

  crates-io:
    needs: ci
    runs-on: macos-15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - name: Verify tag matches crate version
        run: |
          crate_version=$(cargo +stable metadata --locked --no-deps --format-version 1 |
            python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          readonly crate_version
          test "v${crate_version}" = "${GITHUB_REF_NAME}"
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - run: cargo +stable publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
