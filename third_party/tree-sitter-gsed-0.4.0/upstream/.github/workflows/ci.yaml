name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  parser:
    name: Test parsers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
      - uses: tree-sitter/setup-action/cli@v2
      - name: Set up check tools
        if: runner.os == 'macOS'
        shell: sh
        run: |
          brew install llvm ts_query_ls
          {
            printf 'CC=%s/bin/clang\n' "$(brew --prefix llvm)"
            printf 'CFLAGS=-std=c17 -isysroot %s\n' "$(xcrun --sdk macosx --show-sdk-path)"
          } >>"$GITHUB_ENV"
      - run: npm ci
      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Set up Rust check tools
        if: runner.os == 'macOS'
        shell: sh
        run: rustup component add --toolchain stable clippy rustfmt
      - name: Fetch Rust dependencies
        run: cargo fetch --locked
      - name: Check sources
        if: runner.os == 'macOS'
        shell: sh
        run: |
          npm run check
          node scripts/check-generated.js
          node scripts/check-c.js
          cargo +stable clippy --locked --all-targets -- -D warnings
          cargo +stable fmt --all -- --check
      - uses: tree-sitter/parser-test-action@v3
        with:
          generate: false
          test-parser-cmd: npm test
          test-rust: true
          rust-version: stable
      - name: Test Rust builds
        run: npm exec --call "node --test test/rust/build.test.js"
      - name: Validate queries
        if: runner.os == 'macOS'
        shell: sh
        run: |
          npm run build
          npm run check:queries
