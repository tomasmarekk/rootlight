# Local static binding; the upstream private version is not a published release.
[package]
name = "tree-sitter-v"
version = "0.0.6"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/vlang/v-analyzer"
description = "Pinned V syntax tables with an unpublished local static binding"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"
