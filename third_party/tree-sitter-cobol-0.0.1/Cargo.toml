# Local dual-format binding for pinned MIT COBOL grammar sources.
# Compilation uses retained C tables; it neither downloads nor generates code.
[package]
name = "tree-sitter-cobol"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/yutaro-sakamoto/tree-sitter-cobol"
description = "Pinned COBOL grammar with explicit fixed and free profiles"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"
