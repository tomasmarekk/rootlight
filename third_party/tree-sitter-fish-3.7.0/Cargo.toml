# Static local binding; upstream lifecycle scripts are inert source evidence.
[package]
name = "tree-sitter-fish"
version = "3.7.0"
edition = "2024"
rust-version = "1.90"
license = "Unlicense"
license-file = "LICENSE"
repository = "https://github.com/ram02z/tree-sitter-fish"
description = "Pinned Fish syntax tables and stateless scanner"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"

[dev-dependencies]
tree-sitter = "=0.26.11"
