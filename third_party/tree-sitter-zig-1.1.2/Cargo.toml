# Compile complete retained local syntax tables without generation or acquisition.
[package]
name = "tree-sitter-zig"
version = "1.1.2"
edition = "2024"
rust-version = "1.90"
license = "MIT"
license-file = "LICENSE"
repository = "https://github.com/tree-sitter-grammars/tree-sitter-zig"
description = "Pinned Zig syntax tables with empty-container grammar correction"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"

[dev-dependencies]
tree-sitter = "=0.26.11"
