# Local unpublished binding for pinned MIT PL/SQL grammar sources.
# Compilation uses locally generated ABI14 tables without acquisition or generation.
[package]
name = "tree-sitter-plsql"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/andreasmaierde/tree-sitter-plsql"
description = "Pinned PL/SQL grammar with a local static language binding"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"
