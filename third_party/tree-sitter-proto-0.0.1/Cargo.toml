# Local static binding; upstream manifests and lifecycle scripts are inert.
[package]
name = "tree-sitter-proto"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/treywood/tree-sitter-proto"
description = "Pinned protobuf syntax tables with a local static binding"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"
