# Local static binding; complete upstream sources remain inert evidence.
[package]
name = "tree-sitter-cue"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
license-file = "LICENSE"
repository = "https://github.com/cue-lang/tree-sitter-cue"
description = "Pinned CUE syntax tables and raw-string scanner"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"

[dev-dependencies]
tree-sitter = "=0.26.11"
