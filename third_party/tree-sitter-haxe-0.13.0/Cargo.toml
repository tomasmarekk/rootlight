[package]
name = "tree-sitter-haxe"
version = "0.13.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Local ABI binding to pinned Haxe grammar sources"
repository = "https://github.com/vantreeseba/tree-sitter-haxe"
build = "bindings/rust/build.rs"
autoexamples = false
autotests = false

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1.22"
