# Local static binding for the retained TypeSpec native parser.
# Upstream manifests and lifecycle hooks remain inert under upstream/.
[package]
name = "tree-sitter-typespec"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/happenslol/tree-sitter-typespec"
description = "Pinned TypeSpec grammar with a local static language binding"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"

[dev-dependencies]
tree-sitter = "=0.26.11"
