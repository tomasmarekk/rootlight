# Local static binding; original manifests and lifecycle scripts remain inert.
[package]
name = "tree-sitter-nim"
version = "0.6.2"
edition = "2024"
rust-version = "1.90"
license = "MPL-2.0"
license-file = "LICENSE.txt"
repository = "https://github.com/alaviss/tree-sitter-nim"
description = "Pinned Nim grammar with a local static binding"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"
