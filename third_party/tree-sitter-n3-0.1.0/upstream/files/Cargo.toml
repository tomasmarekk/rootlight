[package]
name = "tree-sitter-n3"
description = "N3 grammar for the tree-sitter parsing library"
version = "0.0.1"
keywords = ["incremental", "parsing", "turtle"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/eyusupov/tree-sitter-n3"
edition = "2025"
license = "MIT"

build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter = "0.21"

[build-dependencies]
cc = "1.0"
