# Local static binding for the retained MIT embedded-template grammar.
# Source acquisition and generation are separate preparation steps.
[package]
name = "tree-sitter-embedded-template"
version = "0.25.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/tree-sitter/tree-sitter-embedded-template"
description = "Pinned embedded-template grammar with local static binding"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"
