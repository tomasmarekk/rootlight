# Unpublished local binding for retained OCaml native inputs.
# The exact upstream manifest is retained separately in Cargo.toml.upstream.
[package]
name = "tree-sitter-ocaml"
description = "OCaml grammar for tree-sitter"
version = "0.25.0"
license = "MIT"
readme = "bindings/rust/README.md"
keywords = ["incremental", "parsing", "tree-sitter", "ocaml"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/tree-sitter/tree-sitter-ocaml"
edition = "2024"
rust-version = "1.90"
publish = false
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "bindings/rust",
  "common",
  "grammars/ocaml/grammar.js",
  "grammars/ocaml/src",
  "grammars/interface/grammar.js",
  "grammars/interface/src",
  "grammars/type/grammar.js",
  "grammars/type/src",
  "queries",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"

[dev-dependencies]
tree-sitter = "=0.26.11"
