# Compile only complete retained local parser and scanner inputs.
[package]
name = "tree-sitter-crystal"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
license-file = "LICENSE"
repository = "https://github.com/crystal-lang-tools/tree-sitter-crystal"
description = "Pinned Crystal grammar and bounded native state restoration"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"

[dev-dependencies]
tree-sitter = "=0.26.11"
