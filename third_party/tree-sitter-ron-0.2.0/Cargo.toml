# Local static binding for retained RON native parser sources.
# Upstream manifests and lifecycle hooks stay inert under upstream/.
[package]
name = "tree-sitter-ron"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/tree-sitter-grammars/tree-sitter-ron"
description = "Pinned RON grammar with a local static language binding"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"

[dev-dependencies]
tree-sitter = "=0.26.11"
