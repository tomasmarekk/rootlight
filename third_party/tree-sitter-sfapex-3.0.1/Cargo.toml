# Local unpublished Apex-only wrapper for the pinned sfapex source archive.
# The original package builds four parsers; this local build retains only Apex.
[package]
name = "tree-sitter-sfapex"
version = "3.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/aheber/tree-sitter-sfapex"
description = "Pinned Apex grammar with a local static language binding"
publish = false
build = "build.rs"

[lib]
path = "src/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"
