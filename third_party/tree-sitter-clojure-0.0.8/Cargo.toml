# Local static binding; original generator and Node bindings remain inert.
[package]
name = "tree-sitter-clojure"
version = "0.0.8"
edition = "2024"
rust-version = "1.90"
license = "CC0-1.0"
license-file = "COPYING.txt"
repository = "https://github.com/theHamsta/tree-sitter-clojure"
description = "Pinned Clojure reader grammar with a local static binding"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"
