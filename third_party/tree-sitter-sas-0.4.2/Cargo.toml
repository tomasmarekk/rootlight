# Unpublished local binding; original published manifests remain beside this file.
# Builds consume checked-in static sources and existing versioned dependencies.
[package]
name = "tree-sitter-sas"
version = "0.4.2"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ix-infrastructure/tree-sitter-sas"
description = "Pinned SAS grammar with a local static language binding"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"
