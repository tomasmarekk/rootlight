# Local unpublished binding for retained MIT HLSL, C++ and C grammar sources.
# Compilation uses the static repaired table and scanner without generation.
[package]
name = "tree-sitter-hlsl"
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/theHamsta/tree-sitter-hlsl"
authors = ["tree-sitter-c authors around Max Brunsfeld", "Stephan Seitz"]
description = "Pinned HLSL grammar with a local static language binding"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"
