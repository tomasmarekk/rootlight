[package]
name = "tree-sitter-wolfram"
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/WolframResearch/tree-sitter-wolfram"
description = "Pinned Wolfram tables with checked request-scoped scanner work and comment depth"
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "=0.1.7"

[build-dependencies]
cc = "=1.2.67"
