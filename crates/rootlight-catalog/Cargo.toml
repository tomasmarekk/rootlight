[package]
name = "rootlight-catalog"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dependencies]
blake3.workspace = true
rootlight-ids = { path = "../rootlight-ids" }
rootlight-ir = { path = "../rootlight-ir" }
rootlight-storage = { path = "../rootlight-storage" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix.workspace = true

[target.'cfg(windows)'.dependencies]
nt-token.workspace = true
windows.workspace = true
windows-permissions.workspace = true
winapi-util.workspace = true

[dev-dependencies]
rootlight-adapter-sdk = { path = "../rootlight-adapter-sdk" }
rootlight-adapter-treesitter = { path = "../rootlight-adapter-treesitter" }
rootlight-cancel = { path = "../rootlight-cancel" }
rootlight-vfs = { path = "../rootlight-vfs" }
tempfile.workspace = true

[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"

[lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
