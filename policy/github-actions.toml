# Third-party actions are accepted only at these immutable commits.

schema_version = "1.0"

[[actions]]
repository = "actions/checkout"
commit = "df4cb1c069e1874edd31b4311f1884172cec0e10"
release = "v6.0.3"

[[actions]]
repository = "actions/cache"
commit = "55cc8345863c7cc4c66a329aec7e433d2d1c52a9"
release = "v6.1.0"

[[actions]]
repository = "actions/attest"
commit = "a1948c3f048ba23858d222213b7c278aabede763"
release = "v4.2.0"

[[actions]]
repository = "actions/download-artifact"
commit = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
release = "v8.0.1"

[[actions]]
repository = "actions/upload-artifact"
commit = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
release = "v7.0.1"

[[actions]]
repository = "sigstore/cosign-installer"
commit = "6f9f17788090df1f26f669e9d70d6ae9567deba6"
release = "v4.1.2"

[[write_permission_jobs]]
workflow = ".github/workflows/release-candidate.yml"
job = "release-signing"
condition = "github.ref == 'refs/heads/main' && inputs.source_sha == github.sha"
permissions = [
  "artifact-metadata=write",
  "attestations=write",
  "contents=read",
  "id-token=write",
]

[[write_permission_jobs]]
workflow = ".github/workflows/release.yml"
job = "sign-update-metadata"
condition = "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'"
permissions = [
  "actions=read",
  "contents=none",
  "id-token=write",
]

[[write_permission_jobs]]
workflow = ".github/workflows/release.yml"
job = "publish"
condition = "github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'"
permissions = [
  "actions=read",
  "contents=write",
]
