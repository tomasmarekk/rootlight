schema_version = "1.0"
status = "accepted_bounded_fallback"
decision_owner = "@tomasmarekk"
decision = "retain_shared_history"

rationale = [
  "preserve_shared_object_identity",
  "avoid_invalidating_existing_references_and_attestations",
  "rewriting_does_not_remove_existing_clones_or_mirrors",
]

prevention_controls = [
  "local_commit_message_hook",
  "incoming_commit_range_check",
  "event_title_and_body_check",
  "tracked_public_content_check",
  "negative_boundary_fixtures",
  "redacted_diagnostics",
]

residual_risks = [
  "retained_commit_metadata_can_contain_obsolete_internal_labels",
  "complete_history_recipients_can_observe_retained_metadata",
]

permitted_claims = [
  "new_metadata_is_checked_by_local_and_ci_controls",
  "shared_commit_identity_is_preserved",
]

prohibited_claims = [
  "existing_history_is_sanitized",
  "source_archives_erase_metadata_from_existing_clones",
]

release_conditions = [
  "reassess_before_transfer_to_a_new_public_canonical_remote",
  "require_explicitly_coordinated_migration_for_any_rewrite",
  "never_rewrite_from_hooks_ci_maintenance_or_release_automation",
]

verification_commands = [
  "cargo test --locked -p xtask git_metadata::tests",
  "cargo run --locked --quiet --package xtask -- architecture-check",
]
