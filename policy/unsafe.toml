schema_version = "3.0"

[[boundaries]]
package = "rootlight-vfs"
package_version = "0.1.0"
manifest = "crates/rootlight-vfs/Cargo.toml"
module = "rootlight_vfs::platform::os"
source = "crates/rootlight-vfs/src/platform/os.rs"
status = "enabled"
owner = "@tomasmarekk"
reason = "native handle APIs are required for private-at-birth creation, exact identity, atomic no-replace publication, and identity-bound cleanup"
expected_source_tokens = 5
expected_geiger_count = 17
geiger_host_os = "all"

[[boundaries]]
package = "rootlight-catalog"
package_version = "0.1.0"
manifest = "crates/rootlight-catalog/Cargo.toml"
module = "rootlight_catalog::schema::macos_acl"
source = "crates/rootlight-catalog/src/schema/macos_acl.rs"
status = "enabled"
owner = "@tomasmarekk"
reason = "Darwin descriptor ACL APIs are required to remove inherited access and verify account-private SQLite files without a path race"
expected_source_tokens = 5
expected_geiger_count = 17
geiger_host_os = "all"

[[boundaries]]
package = "rootlight-sandbox"
package_version = "0.1.0"
manifest = "crates/rootlight-sandbox/Cargo.toml"
module = "rootlight_sandbox::platform::os"
source = "crates/rootlight-sandbox/src/platform/os.rs"
status = "enabled"
owner = "@tomasmarekk"
reason = "Win32 process creation, explicit inherited-handle lists, exact process ownership, and Job Object containment require native APIs unavailable through stable safe Rust"
expected_source_tokens = 22
expected_geiger_count = 108
geiger_host_os = "windows"
