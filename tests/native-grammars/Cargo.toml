# Isolated syntax and FFI regression tests for pinned native grammars.
# Production workspace crates retain their forbid-unsafe policy.
[package]
name = "rootlight-native-grammar-tests"
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "AGPL-3.0-only"

[workspace]
resolver = "3"

[dev-dependencies]
tree-sitter-scala = { path = "../../third_party/tree-sitter-scala-0.26.2", version = "=0.26.2", default-features = false }
tree-sitter-solidity = { version = "=1.2.13", default-features = false }
tree-sitter-r = { path = "../../third_party/tree-sitter-r-1.3.0", version = "=1.3.0", default-features = false }
tree-sitter-sequel = { path = "../../third_party/tree-sitter-sequel-0.3.11", version = "=0.3.11", default-features = false }
tree-sitter-bash = { path = "../../third_party/tree-sitter-bash-0.25.1", version = "=0.25.1", default-features = false }
tree-sitter = { version = "=0.26.11", default-features = false, features = ["std"] }
tree-sitter-json = { path = "../../third_party/tree-sitter-json-0.24.8", version = "=0.24.8", default-features = false }
tree-sitter-html = { path = "../../third_party/tree-sitter-html-0.23.2", version = "=0.23.2", default-features = false }
tree-sitter-swift = { path = "../../third_party/tree-sitter-swift-0.7.3", version = "=0.7.3", default-features = false }
tree-sitter-toml-ng = { path = "../../third_party/tree-sitter-toml-ng-0.7.0", version = "=0.7.0", default-features = false }
tree-sitter-yaml = { path = "../../third_party/tree-sitter-yaml-0.7.2", version = "=0.7.2", default-features = false }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
