syntax = "proto3";

package rootlight.daemon.v1;

import "common.proto";
import "ui_graph_v1.proto";

// Client-supported protocol range, capabilities, and authenticated session identity.
message ClientHello {
  rootlight.common.v1.VersionRange supported_protocols = 1;
  repeated string capabilities = 2;
  bytes expected_instance_nonce = 3;
  bytes client_instance_id = 4;
}

// Server-selected protocol and the bounded negotiation result.
message ServerHello {
  rootlight.common.v1.ContractVersion selected_protocol = 1;
  repeated string capabilities = 2;
  optional rootlight.common.v1.PublicError error = 3;
  bytes instance_nonce = 4;
}

// Bounded request envelope for one local daemon operation.
message RequestEnvelope {
  uint64 request_id = 1;
  bytes instance_nonce = 2;
  optional uint32 timeout_ms = 3;
  optional FirstSliceEffectiveBudget effective_budget = 4;
  oneof request {
    HealthRequest health = 10;
    OperationStatusRequest operation_status = 11;
    OperationCancelRequest operation_cancel = 12;
    OperationSubmitRequest operation_submit = 13;
    OperationLeaseRenewRequest operation_lease_renew = 14;
    DiagnosticsQuickRequest diagnostics_quick = 15;
    SupportBundleRequest support_bundle = 16;
    RepositoryIndexRequest repository_index = 30;
    RepositoryOperationStatusRequest repository_operation_status = 31;
    CodeLocateRequest code_locate = 32;
    SymbolExplainRequest symbol_explain = 33;
    SourceReadRequest source_read = 34;
    RepositoryListRequest repository_list = 35;
    RepositoryStatusRequest repository_status = 36;
    SymbolRelationshipsRequest symbol_relationships = 37;
    FlowTraceRequest flow_trace = 38;
    ArchitectureCyclesRequest architecture_cycles = 39;
    CodeDeadRequest code_dead = 40;
    ArchitectureOverviewRequest architecture_overview = 41;
    TestsSelectRequest tests_select = 42;
    ChangeImpactRequest change_impact = 43;
    PlanChangeRequest plan_change = 44;
    HistoryCompareRequest history_compare = 45;
    AdvancedQueryRequest advanced_query = 46;
    RepositoryCatalogPageRequest repository_catalog_page = 47;
    GraphProjectionOpenRequest graph_projection_open = 48;
    GraphProjectionPageRequest graph_projection_page = 49;
    GraphProjectionReleaseRequest graph_projection_release = 50;
    RepositoryCatalogMutationRequest repository_catalog_mutation = 51;
  }
}

// Complete validated resource ceilings for one first-slice request.
message FirstSliceEffectiveBudget {
  uint32 schema_version = 1;
  uint64 rows = 2;
  uint64 edges = 3;
  uint64 results = 4;
  uint64 source_bytes = 5;
  uint64 json_bytes = 6;
  uint64 estimated_tokens = 7;
  uint64 memory_bytes = 8;
  uint64 duration_micros = 9;
  optional uint64 depth = 10;
  optional uint64 paths = 11;
}

// Bounded response envelope paired with one request identifier.
message ResponseEnvelope {
  uint64 request_id = 1;
  oneof response {
    HealthResponse health = 10;
    OperationStatusResponse operation_status = 11;
    OperationCancelResponse operation_cancel = 12;
    OperationSubmitResponse operation_submit = 13;
    OperationLeaseRenewResponse operation_lease_renew = 14;
    DiagnosticsQuickResponse diagnostics_quick = 15;
    SupportBundleResponse support_bundle = 16;
    RepositoryIndexResponse repository_index = 30;
    RepositoryOperationStatusResponse repository_operation_status = 31;
    CodeLocateResponse code_locate = 32;
    SymbolExplainResponse symbol_explain = 33;
    SourceReadResponse source_read = 34;
    RepositoryListResponse repository_list = 35;
    RepositoryStatusResponse repository_status = 36;
    SymbolRelationshipsResponse symbol_relationships = 37;
    FlowTraceResponse flow_trace = 38;
    ArchitectureCyclesResponse architecture_cycles = 39;
    CodeDeadResponse code_dead = 40;
    ArchitectureOverviewResponse architecture_overview = 41;
    TestsSelectResponse tests_select = 42;
    ChangeImpactResponse change_impact = 43;
    PlanChangeResponse plan_change = 44;
    HistoryCompareResponse history_compare = 45;
    AdvancedQueryResponse advanced_query = 46;
    RepositoryCatalogPageResponse repository_catalog_page = 47;
    GraphProjectionResponse graph_projection = 48;
    GraphProjectionReleaseResponse graph_projection_release = 50;
    RepositoryCatalogMutationResponse repository_catalog_mutation = 51;
    rootlight.common.v1.PublicError error = 20;
  }
}

// Whole-repository marker accepted only by architecture and files views.
message GraphProjectionWholeRepository {}

// Bounded explicit file scope reserved for storage-supported projections.
message GraphProjectionFileScope {
  repeated rootlight.common.v1.FileId files = 1;
}

// Bounded explicit symbol seeds for symbol and direct-neighborhood views.
message GraphProjectionSymbolScope {
  repeated rootlight.common.v1.SymbolId symbols = 1;
}

// Closed projection scope. Unsupported combinations fail rather than sampling.
message GraphProjectionScope {
  oneof scope {
    GraphProjectionWholeRepository whole_repository = 1;
    string component_id = 2;
    string directory_id = 3;
    GraphProjectionFileScope files = 4;
    GraphProjectionSymbolScope symbols = 5;
  }
}

// Closed bounded filters applied before a graph snapshot is created.
message GraphProjectionFilters {
  repeated rootlight.ui.graph.v1.NodeKind node_kinds = 1;
  repeated rootlight.ui.graph.v1.RelationKind relations = 2;
  repeated string languages = 3;
  uint32 min_confidence = 4;
  optional bool include_inferred = 5;
  optional bool include_generated = 6;
  optional string community_id = 7;
  optional uint32 hotspot_threshold = 8;
}

// Caller-requested graph page and aggregate limits.
message GraphProjectionBudget {
  uint32 page_nodes = 1;
  uint32 page_edges = 2;
  uint32 aggregate_nodes = 3;
  uint32 aggregate_edges = 4;
}

// Server-clamped graph limits retained by every page.
message GraphProjectionEffectiveBudget {
  uint32 page_nodes = 1;
  uint32 page_edges = 2;
  uint32 aggregate_nodes = 3;
  uint32 aggregate_edges = 4;
}

// Opens one exact-generation source-free graph projection and returns its first page.
message GraphProjectionOpenRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.RepositoryId repository = 2;
  rootlight.common.v1.GenerationId generation = 3;
  rootlight.ui.graph.v1.ProjectionView view = 4;
  GraphProjectionScope scope = 5;
  GraphProjectionFilters filters = 6;
  GraphProjectionBudget budget = 7;
}

// Reads the next sequential page from one authenticated projection.
message GraphProjectionPageRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  bytes projection_id = 2;
  bytes cursor = 3;
}

// Explicitly releases one authenticated projection snapshot.
message GraphProjectionReleaseRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  bytes projection_id = 2;
}

// One exact-generation graph page and its authoritative completeness metadata.
message GraphProjectionResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  bytes projection_id = 2;
  optional bytes next_cursor = 3;
  FirstSliceQueryContext context = 4;
  FirstSliceCompleteness completeness = 5;
  GraphProjectionEffectiveBudget effective_budget = 6;
  rootlight.ui.graph.v1.GraphPage page = 7;
}

// Confirms explicit release without disclosing another client's projection state.
message GraphProjectionReleaseResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  bytes projection_id = 2;
  bool released = 3;
}

// Source-free daemon health request.
message HealthRequest {}

// Source-free daemon lifecycle state.
enum DaemonLifecycle {
  DAEMON_LIFECYCLE_UNSPECIFIED = 0;
  STARTING = 1;
  READY = 2;
  DRAINING = 3;
  FAULTED = 4;
  STOPPED = 5;
}

// Closed status for one daemon subsystem.
enum HealthStatus {
  HEALTH_STATUS_UNSPECIFIED = 0;
  HEALTH_STATUS_HEALTHY = 1;
  HEALTH_STATUS_DEGRADED = 2;
  HEALTH_STATUS_UNAVAILABLE = 3;
  HEALTH_STATUS_NOT_CONFIGURED = 4;
  HEALTH_STATUS_FAILED = 5;
}

// Closed classification for bounded host resource pressure.
enum ResourcePressure {
  RESOURCE_PRESSURE_UNSPECIFIED = 0;
  RESOURCE_PRESSURE_NORMAL = 1;
  RESOURCE_PRESSURE_ELEVATED = 2;
  RESOURCE_PRESSURE_HIGH = 3;
  RESOURCE_PRESSURE_CRITICAL = 4;
  RESOURCE_PRESSURE_UNKNOWN = 5;
}

// Source-free daemon health and readiness response.
message HealthResponse {
  bool ready = 1;
  uint32 active_operations = 2;
  uint32 admitted_operations = 3;
  string protocol_version = 4;
  DaemonLifecycle lifecycle = 5;
  bool accepting_operations = 6;
  uint32 active_connections = 7;
  uint32 connection_limit = 8;
  uint32 queued_operations = 9;
  uint32 running_operations = 10;
  uint32 operation_queue_limit = 11;
  bool journal_healthy = 12;
  HealthStatus catalog_status = 13;
  uint32 catalog_schema_version = 14;
  HealthStatus generation_status = 15;
  HealthStatus adapter_status = 16;
  HealthStatus watcher_status = 17;
  ResourcePressure resource_pressure = 18;
  HealthStatus endpoint_status = 19;
  uint32 endpoint_schema_version = 20;
}

// Requests bounded source-free catalog diagnostics.
message DiagnosticsQuickRequest {}

// Closed diagnostic checks supported by the current control plane.
enum DiagnosticCheck {
  DIAGNOSTIC_CHECK_UNSPECIFIED = 0;
  DIAGNOSTIC_CHECK_CATALOG_QUICK_CHECK = 1;
}

// Closed outcome for one diagnostic check.
enum DiagnosticOutcome {
  DIAGNOSTIC_OUTCOME_UNSPECIFIED = 0;
  DIAGNOSTIC_OUTCOME_PASSED = 1;
  DIAGNOSTIC_OUTCOME_FAILED = 2;
  DIAGNOSTIC_OUTCOME_TIMED_OUT = 3;
  DIAGNOSTIC_OUTCOME_UNAVAILABLE = 4;
}

// One source-free bounded diagnostic result.
message DiagnosticResult {
  DiagnosticCheck check = 1;
  DiagnosticOutcome outcome = 2;
  uint32 duration_ms = 3;
  optional rootlight.common.v1.PublicError error = 4;
}

// Bounded quick-diagnostics response.
message DiagnosticsQuickResponse {
  uint32 schema_version = 1;
  HealthStatus overall_status = 2;
  repeated DiagnosticResult results = 3;
}

// Requests a bounded source-free support bundle.
message SupportBundleRequest {}

// Returns one validated in-memory support archive.
message SupportBundleResponse {
  uint32 schema_version = 1;
  bytes archive = 2;
  bytes sha256 = 3;
  uint64 archive_bytes = 4;
  bool contains_source = 5;
}

// Durable operation lifecycle state.
enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  QUEUED = 1;
  RUNNING = 2;
  CANCELLING = 3;
  SUCCEEDED = 4;
  FAILED = 5;
  INTERRUPTED = 6;
  CANCELLED = 7;
}

// Closed operation kinds supported by the current control plane.
enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  CONTROL_PROBE = 1;
  REPOSITORY_INDEX = 2;
  RECOVERY = 3;
}

// Monotonic infrastructure stages for the bounded control probe.
enum OperationStage {
  OPERATION_STAGE_UNSPECIFIED = 0;
  ACCEPTED = 1;
  EXECUTING = 2;
  CLEANUP = 3;
}

// Why a recovered operation did not continue automatically.
enum RecoveryClass {
  RECOVERY_CLASS_UNSPECIFIED = 0;
  NOT_APPLICABLE = 1;
  INTERRUPTED_BY_RESTART = 2;
  DEADLINE_ELAPSED = 3;
  LEASE_EXPIRED = 4;
}

// Durable operation status safe for local clients.
message OperationStatus {
  rootlight.common.v1.OperationId operation = 1;
  OperationState state = 2;
  uint64 revision = 3;
  uint32 completed_units = 4;
  uint32 total_units = 5;
  optional rootlight.common.v1.PublicError error = 6;
  OperationKind kind = 7;
  OperationStage stage = 8;
  bytes plan_hash = 9;
  bool detached = 10;
  bool cancellation_requested = 11;
  optional uint64 deadline_unix_ms = 12;
  optional uint64 lease_expires_unix_ms = 13;
  RecoveryClass recovery_class = 14;
}

// Requests the latest durable state for one operation.
message OperationStatusRequest {
  rootlight.common.v1.OperationId operation = 1;
}

// Returns one durable operation state.
message OperationStatusResponse {
  OperationStatus operation = 1;
}

// Requests cooperative cancellation for one operation.
message OperationCancelRequest {
  rootlight.common.v1.OperationId operation = 1;
}

// Reports whether cancellation was newly requested.
message OperationCancelResponse {
  OperationStatus operation = 1;
  bool accepted = 2;
}

// Submits one bounded operation definition for durable admission.
message OperationSubmitRequest {
  rootlight.common.v1.OperationId operation = 1;
  OperationKind kind = 2;
  bytes plan_hash = 3;
  bool detached = 4;
  optional uint64 timeout_ms = 5;
  optional uint64 deadline_unix_ms = 6;
  optional uint64 lease_expires_unix_ms = 7;
}

// Returns the newly queued durable operation.
message OperationSubmitResponse {
  OperationStatus operation = 1;
}

// Extends one attached operation lease for its authenticated owner.
message OperationLeaseRenewRequest {
  rootlight.common.v1.OperationId operation = 1;
  uint64 lease_expires_unix_ms = 2;
}

// Returns the durable operation after lease renewal.
message OperationLeaseRenewResponse {
  OperationStatus operation = 1;
}

// Selects the active or one explicit immutable repository generation.
message GenerationSelector {
  oneof selector {
    bool active = 1;
    rootlight.common.v1.GenerationId generation = 2;
  }
}

// One generation-bound immutable source reference.
message FirstSliceSourceRef {
  rootlight.common.v1.RepositoryId repository = 1;
  rootlight.common.v1.GenerationId generation = 2;
  rootlight.common.v1.FileId file = 3;
  uint64 start_byte = 4;
  uint64 end_byte = 5;
  rootlight.common.v1.ContentHash content_hash = 6;
  optional uint64 start_line = 7;
  optional uint64 end_line = 8;
}

// Analysis strength requested for one repository generation.
enum RepositoryIndexMode {
  REPOSITORY_INDEX_MODE_UNSPECIFIED = 0;
  REPOSITORY_INDEX_STRUCTURAL = 1;
  REPOSITORY_INDEX_DEEP = 2;
  REPOSITORY_INDEX_AUTO = 3;
}

// Requests admission of one supported whole-repository index plan.
message RepositoryIndexRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  string root = 2;
  rootlight.common.v1.OperationId operation = 3;
  bool detached = 4;
  RepositoryIndexMode mode = 5;
}

// One bounded source-free diagnostic retained by repository indexing.
message RepositoryIndexDiagnostic {
  string code = 1;
  string message = 2;
}

// Reports the admitted first-slice indexing operation.
message RepositoryIndexResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.RepositoryId repository = 2;
  rootlight.common.v1.OperationId operation = 3;
  OperationState state = 4;
  uint64 revision = 5;
  optional rootlight.common.v1.GenerationId parent_generation = 6;
  optional rootlight.common.v1.GenerationId published_generation = 7;
  uint64 discovered_inputs = 8;
  uint64 indexed_files = 9;
  uint64 entities = 10;
  uint64 elapsed_micros = 11;
  uint64 estimated_disk_bytes = 12;
  repeated RepositoryIndexDiagnostic diagnostics = 13;
  RepositoryIndexMode mode = 14;
  // Separately journaled semantic refinement created by Auto mode.
  optional rootlight.common.v1.OperationId semantic_operation = 15;
}

// Action accepted by the first-slice operation status request.
enum RepositoryOperationAction {
  REPOSITORY_OPERATION_ACTION_UNSPECIFIED = 0;
  REPOSITORY_OPERATION_GET = 1;
  REPOSITORY_OPERATION_CANCEL = 2;
}

// Reads or cooperatively cancels one operation created by repository indexing.
message RepositoryOperationStatusRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.OperationId operation = 2;
  RepositoryOperationAction action = 3;
  optional uint32 wait_ms = 4;
  optional uint64 after_revision = 5;
}

// Returns journal state plus durable first-slice publication metadata.
message RepositoryOperationStatusResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  OperationStatus operation = 2;
  optional rootlight.common.v1.GenerationId published_generation = 3;
  uint64 started_unix_ms = 4;
  uint64 peak_rss_bytes = 5;
  uint64 written_bytes = 6;
  uint64 files_examined = 7;
  optional uint32 retry_after_ms = 8;
  uint64 bytes_examined = 9;
  string index_stage = 10;
  // Separately journaled semantic refinement created by a successful Auto operation.
  optional rootlight.common.v1.OperationId semantic_operation = 11;
  RepositoryBuildStrategy build_strategy = 12;
  optional RepositoryFallbackReason fallback_reason = 13;
  uint64 invalidated_units = 14;
  uint64 changed_inputs = 15;
  uint64 changed_files = 16;
  uint64 reused_files = 17;
  uint64 rebuilt_files = 18;
  uint64 reused_facts = 19;
  uint64 rebuilt_facts = 20;
  uint64 referenced_bytes = 21;
  uint64 newly_written_bytes = 22;
  // Generation-owned accounting is separate from process-wide peak RSS.
  uint64 reserved_memory_bytes = 23;
  uint64 owned_memory_bytes = 24;
}

// Operation-local construction strategy retained with the durable receipt.
enum RepositoryBuildStrategy {
  REPOSITORY_BUILD_STRATEGY_UNSPECIFIED = 0;
  REPOSITORY_BUILD_INITIAL = 1;
  REPOSITORY_BUILD_DEPENDENCY_DIRECTED = 2;
  REPOSITORY_BUILD_CONSERVATIVE_REPOSITORY_REBUILD = 3;
  REPOSITORY_BUILD_RETAINED_GENERATION = 4;
}

// Source-free reason fine-grained invalidation expanded to a full rebuild.
enum RepositoryFallbackReason {
  REPOSITORY_FALLBACK_REASON_UNSPECIFIED = 0;
  REPOSITORY_FALLBACK_MISSING_DEPENDENCY_DECLARATION = 1;
  REPOSITORY_FALLBACK_CLOSURE_WORK_EXCEEDED = 2;
}

// First-slice lexical locate mode.
enum FirstSliceLocateMode {
  FIRST_SLICE_LOCATE_MODE_UNSPECIFIED = 0;
  FIRST_SLICE_LOCATE_EXACT = 1;
  FIRST_SLICE_LOCATE_PREFIX = 2;
  FIRST_SLICE_LOCATE_TEXT = 3;
  FIRST_SLICE_LOCATE_SAFE_REGEX = 4;
  FIRST_SLICE_LOCATE_GLOB = 5;
}

// Aggregate support tier for one first-slice response.
enum FirstSliceAnalysisTier {
  FIRST_SLICE_ANALYSIS_TIER_UNSPECIFIED = 0;
  FIRST_SLICE_TIER_A = 1;
  FIRST_SLICE_TIER_B = 2;
  FIRST_SLICE_TIER_C = 3;
  FIRST_SLICE_TIER_D = 4;
}

// Aggregate completeness for one first-slice response.
enum FirstSliceCoverageStatus {
  FIRST_SLICE_COVERAGE_STATUS_UNSPECIFIED = 0;
  FIRST_SLICE_COVERAGE_COMPLETE = 1;
  FIRST_SLICE_COVERAGE_BOUNDED = 2;
  FIRST_SLICE_COVERAGE_SAMPLED = 3;
  FIRST_SLICE_COVERAGE_UNKNOWN = 4;
}

// Bounded measured usage for one first-slice query.
message FirstSliceQueryUsage {
  uint64 rows = 1;
  uint64 edges = 2;
  uint64 results = 3;
  uint64 source_bytes = 4;
  uint64 json_bytes = 5;
  uint64 estimated_tokens = 6;
  uint64 elapsed_micros = 7;
  optional FirstSliceTokenAccountingProfile token_accounting = 8;
  optional uint64 memory_bytes = 9;
}

// Versioned method used to derive an estimated token count.
enum FirstSliceTokenAccountingProfile {
  FIRST_SLICE_TOKEN_ACCOUNTING_UNSPECIFIED = 0;
  FIRST_SLICE_TOKEN_ACCOUNTING_UTF8_BYTE_UPPER_BOUND_V1 = 1;
}

// Common repository, generation, coverage, and usage correlation.
message FirstSliceQueryContext {
  rootlight.common.v1.RepositoryId repository = 1;
  rootlight.common.v1.GenerationId generation = 2;
  optional rootlight.common.v1.GenerationId parent_generation = 3;
  bool active_generation = 4;
  FirstSliceAnalysisTier tier = 5;
  FirstSliceCoverageStatus coverage_status = 6;
  uint64 skipped_inputs = 7;
  FirstSliceQueryUsage usage = 8;
  string structural_freshness = 9;
  string semantic_freshness = 10;
}

// Authoritative execution-completeness state for one bounded result.
enum FirstSliceCompletenessState {
  FIRST_SLICE_COMPLETENESS_UNSPECIFIED = 0;
  FIRST_SLICE_COMPLETENESS_COMPLETE = 1;
  FIRST_SLICE_COMPLETENESS_TRUNCATED = 2;
  FIRST_SLICE_COMPLETENESS_UNSUPPORTED_PARTIAL = 3;
  FIRST_SLICE_COMPLETENESS_INDETERMINATE = 4;
}

// Stable resource family that limited a bounded result.
enum FirstSliceLimitingResourceKind {
  FIRST_SLICE_LIMIT_UNSPECIFIED = 0;
  FIRST_SLICE_LIMIT_ROWS = 1;
  FIRST_SLICE_LIMIT_EDGES = 2;
  FIRST_SLICE_LIMIT_RESULTS = 3;
  FIRST_SLICE_LIMIT_DEPTH = 4;
  FIRST_SLICE_LIMIT_PATHS = 5;
  FIRST_SLICE_LIMIT_SOURCE_BYTES = 6;
  FIRST_SLICE_LIMIT_RESPONSE_BYTES = 7;
  FIRST_SLICE_LIMIT_MEMORY_BYTES = 8;
  FIRST_SLICE_LIMIT_DEADLINE = 9;
  FIRST_SLICE_LIMIT_ESTIMATED_TOKENS = 10;
  FIRST_SLICE_LIMIT_CANCELLATION = 11;
  FIRST_SLICE_LIMIT_CAPABILITY = 12;
  FIRST_SLICE_LIMIT_COVERAGE = 13;
  FIRST_SLICE_LIMIT_PAGE_SIZE = 14;
}

// One source-free limiting-resource observation.
message FirstSliceLimitingResource {
  FirstSliceLimitingResourceKind kind = 1;
  optional uint64 limit = 2;
  optional uint64 observed = 3;
}

// Whether an incomplete result has a safe continuation.
enum FirstSliceContinuationAvailability {
  FIRST_SLICE_CONTINUATION_UNSPECIFIED = 0;
  FIRST_SLICE_CONTINUATION_NOT_APPLICABLE = 1;
  FIRST_SLICE_CONTINUATION_AVAILABLE = 2;
  FIRST_SLICE_CONTINUATION_UNAVAILABLE = 3;
}

// Typed source-free follow-up guidance for an incomplete result.
enum FirstSliceContinuationGuidance {
  FIRST_SLICE_GUIDANCE_UNSPECIFIED = 0;
  FIRST_SLICE_GUIDANCE_USE_CURSOR = 1;
  FIRST_SLICE_GUIDANCE_NARROW_SCOPE = 2;
  FIRST_SLICE_GUIDANCE_SPLIT_REQUEST = 3;
  FIRST_SLICE_GUIDANCE_REDUCE_DEPTH = 4;
  FIRST_SLICE_GUIDANCE_REDUCE_RELATIONS = 5;
  FIRST_SLICE_GUIDANCE_REQUEST_SOURCE = 6;
  FIRST_SLICE_GUIDANCE_INCREASE_BUDGET_WITHIN_LIMIT = 7;
  FIRST_SLICE_GUIDANCE_REFRESH_COVERAGE = 8;
  FIRST_SLICE_GUIDANCE_UNSUPPORTED_NO_CONTINUATION = 9;
}

// Completeness, limits, and continuation semantics preserved across IPC.
message FirstSliceCompleteness {
  FirstSliceCompletenessState state = 1;
  repeated FirstSliceLimitingResource limiting_resources = 2;
  FirstSliceContinuationAvailability continuation = 3;
  repeated FirstSliceContinuationGuidance guidance = 4;
}

// Requests one bounded generation-pinned lexical lookup.
message CodeLocateRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.RepositoryId repository = 2;
  GenerationSelector generation = 3;
  string query = 4;
  FirstSliceLocateMode mode = 5;
  uint32 maximum_results = 6;
  uint64 page_offset = 7;
  repeated string languages = 8;
}

// One typed lexical lookup result.
message FirstSliceLocateHit {
  rootlight.common.v1.SymbolId symbol = 1;
  rootlight.common.v1.FileId file = 2;
  string identifier = 3;
  string qualified_name = 4;
  string path = 5;
  string kind = 6;
  string language = 7;
  FirstSliceAnalysisTier tier = 8;
  bool generated = 9;
  uint32 score = 10;
  optional FirstSliceSourceRef source = 11;
}

// Returns bounded typed lexical results and generation correlation.
message CodeLocateResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  FirstSliceQueryContext context = 2;
  repeated FirstSliceLocateHit hits = 3;
  uint64 matched_candidates = 4;
  bool truncated = 5;
  optional uint64 next_page_offset = 6;
  FirstSliceCompleteness completeness = 7;
}

// Requests bounded explanations for stable symbols.
message SymbolExplainRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.RepositoryId repository = 2;
  GenerationSelector generation = 3;
  repeated rootlight.common.v1.SymbolId symbols = 4;
}

// One typed, compact symbol explanation.
message FirstSliceSymbolExplanation {
  rootlight.common.v1.SymbolId symbol = 1;
  string kind = 2;
  string display_name = 3;
  optional string signature = 4;
  FirstSliceSourceRef definition = 5;
  uint64 outbound_exact = 6;
  uint64 outbound_candidates = 7;
  uint64 inbound_exact = 8;
  uint64 inbound_candidates = 9;
  uint64 references_exact = 10;
  string provider = 11;
  string evidence = 12;
  uint32 confidence = 13;
  string language = 14;
  FirstSliceAnalysisTier tier = 15;
}

// Returns explanations in request order and unresolved stable identities.
message SymbolExplainResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  FirstSliceQueryContext context = 2;
  repeated FirstSliceSymbolExplanation symbols = 3;
  repeated rootlight.common.v1.SymbolId unresolved_symbols = 4;
  bool truncated = 5;
  FirstSliceCompleteness completeness = 6;
}

enum SourceReadEncoding {
  SOURCE_READ_ENCODING_UTF8 = 0;
  SOURCE_READ_ENCODING_BYTES = 1;
}

// Requests exact generation-bound source references and bounded presentation.
message SourceReadRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.RepositoryId repository = 2;
  GenerationSelector generation = 3;
  repeated FirstSliceSourceRef references = 4;
  uint32 context_lines_before = 5;
  uint32 context_lines_after = 6;
  bool merge_overlaps = 7;
  optional bool include_line_numbers = 8;
  SourceReadEncoding encoding = 9;
}

// One verified exact-byte source chunk.
message FirstSliceSourceChunk {
  FirstSliceSourceRef source = 1;
  string path = 2;
  uint64 start_byte = 3;
  uint64 end_byte = 4;
  // Legacy UTF-8 projection retained for descriptor compatibility.
  uint64 start_line = 5;
  uint64 end_line = 6;
  string content = 7;
  rootlight.common.v1.ContentHash content_hash = 8;
  string language = 9;
  bool generated = 10;
  SourceReadEncoding encoding = 11;
  // Exact optional line projection for new clients.
  optional uint64 included_start_line = 12;
  optional uint64 included_end_line = 13;
  // Exact bytes for both UTF-8 and binary source reads.
  bytes exact_content = 14;
  FirstSliceAnalysisTier tier = 15;
}

// Returns exact verified source chunks.
message SourceReadResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  FirstSliceQueryContext context = 2;
  repeated FirstSliceSourceChunk chunks = 3;
  uint64 total_source_bytes = 4;
  bool truncated = 5;
  FirstSliceCompleteness completeness = 6;
}

// Requests the bounded list of repositories known to this daemon process.
message RepositoryListRequest {
  optional uint32 max_results = 1;
  optional string query = 2;
}

// One repository entry in the bounded repository list.
message RepositoryListEntry {
  rootlight.common.v1.RepositoryId repository = 1;
  rootlight.common.v1.GenerationId active_generation = 2;
  repeated string languages = 3;
  string structural_freshness = 4;
  string semantic_freshness = 5;
  string state = 6;
}

// Returns the bounded list of repositories with their active generation.
message RepositoryListResponse {
  repeated RepositoryListEntry repositories = 1;
}

// Opaque identity of one daemon-owned immutable repository catalog snapshot.
message RepositoryCatalogSnapshotId {
  bytes value = 1;
}

// Opaque versioned continuation key for the repository catalog total order.
message RepositoryCatalogSortKey {
  bytes value = 1;
}

// Requests one bounded page from an immutable repository catalog snapshot.
message RepositoryCatalogPageRequest {
  uint32 page_size = 1;
  optional string normalized_query = 2;
  repeated string states = 3;
  RepositoryCatalogSnapshotId snapshot = 4;
  RepositoryCatalogSortKey after = 5;
  uint32 sort_version = 6;
  bool states_present = 7;
}

// One authoritative repository summary in a catalog snapshot.
message RepositoryCatalogEntry {
  rootlight.common.v1.RepositoryId repository = 1;
  optional rootlight.common.v1.GenerationId active_generation = 2;
  string display_name = 3;
  optional string alias = 4;
  uint64 generation_count = 5;
  string state = 6;
  repeated string languages = 7;
  string structural_freshness = 8;
  string semantic_freshness = 9;
  repeated RepositoryCoverageEntry coverage = 10;
  optional string root_path = 11;
}

// Closed delete command for a repository catalog mutation.
message RepositoryCatalogDelete {}

// Renames one repository or deletes its Rootlight-owned index and metadata.
message RepositoryCatalogMutationRequest {
  rootlight.common.v1.RepositoryId repository = 1;
  oneof mutation {
    string alias = 2;
    RepositoryCatalogDelete delete = 3;
  }
}

// Confirms the authoritative result of one repository catalog mutation.
message RepositoryCatalogMutationResponse {
  rootlight.common.v1.RepositoryId repository = 1;
  optional string alias = 2;
  bool deleted = 3;
}

// Returns one correlated bounded page from an immutable repository catalog.
message RepositoryCatalogPageResponse {
  repeated RepositoryCatalogEntry repositories = 1;
  RepositoryCatalogSnapshotId snapshot = 2;
  RepositoryCatalogSortKey next_after = 3;
  optional uint64 total_count = 4;
  bool truncated = 5;
  uint32 sort_version = 6;
}

// Requests the status of one repository known to this daemon process.
message RepositoryStatusRequest {
  rootlight.common.v1.RepositoryId repository = 1;
  GenerationSelector generation = 2;
  // "summary" or "language"; finer projections are rejected before IPC.
  string coverage_detail = 3;
  bool include_operations = 4;
  // "none", "structural", or "semantic".
  string require_freshness = 5;
}

// One language-scoped coverage entry for one repository generation.
message RepositoryCoverageEntry {
  string language = 1;
  string tier = 2;
  string status = 3;
  uint64 discovered_files = 4;
  uint64 indexed_files = 5;
}

// One bounded source-free repository operation summary.
message RepositoryStatusOperation {
  rootlight.common.v1.OperationId operation = 1;
  OperationKind kind = 2;
  OperationState state = 3;
  uint32 completed_units = 4;
  uint32 total_units = 5;
  bool owned_by_client = 6;
  uint64 started_unix_ms = 7;
}

// Reports one repository's resolved and active generation status.
message RepositoryStatusResponse {
  rootlight.common.v1.RepositoryId repository = 1;
  rootlight.common.v1.GenerationId active_generation = 2;
  // Parent, freshness, and coverage describe the resolved generation.
  optional rootlight.common.v1.GenerationId parent_generation = 3;
  string structural_freshness = 4;
  string semantic_freshness = 5;
  string state = 6;
  repeated RepositoryCoverageEntry coverage = 7;
  rootlight.common.v1.GenerationId resolved_generation = 8;
  optional rootlight.common.v1.GenerationId active_parent_generation = 9;
  string display_name = 10;
  optional string alias = 11;
  string publication_state = 12;
  repeated RepositoryStatusOperation operations = 13;
  string coverage_detail = 14;
  string active_structural_freshness = 15;
  string active_semantic_freshness = 16;
}

// Requests bounded typed relation neighborhoods for stable symbols.
message SymbolRelationshipsRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.RepositoryId repository = 2;
  GenerationSelector generation = 3;
  repeated rootlight.common.v1.SymbolId seeds = 4;
  repeated string relations = 5;
  optional string direction = 6;
  optional uint32 min_confidence = 7;
  optional uint32 max_results = 8;
  uint64 page_offset = 9;
}

// One typed relationship target within a seed-relation group.
message FirstSliceRelationshipTarget {
  rootlight.common.v1.SymbolId symbol = 1;
  uint32 confidence = 2;
  repeated FirstSliceSourceRef source_refs = 3;
}

// One seed-relation group in the relationship response.
message FirstSliceRelationshipGroup {
  rootlight.common.v1.SymbolId seed = 1;
  string relation = 2;
  string direction = 3;
  repeated FirstSliceRelationshipTarget items = 4;
  uint64 total_count = 5;
}

// Returns bounded typed relation neighborhoods and generation correlation.
message SymbolRelationshipsResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  FirstSliceQueryContext context = 2;
  repeated FirstSliceRelationshipGroup groups = 3;
  uint64 returned_edges = 4;
  uint64 total_edges = 5;
  bool exact = 6;
  bool truncated = 7;
  optional uint64 next_page_offset = 8;
  FirstSliceCompleteness completeness = 9;
}

// Requests bounded directed paths between stable symbols.
message FlowTraceRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.RepositoryId repository = 2;
  GenerationSelector generation = 3;
  rootlight.common.v1.SymbolId from = 4;
  rootlight.common.v1.SymbolId to = 5;
  optional string direction = 6;
  repeated string relations = 7;
  optional uint32 max_depth = 8;
  optional uint32 max_paths = 9;
  optional uint32 min_confidence = 10;
  bool cross_repository = 11;
}

// One evidence-bearing edge within a traced path.
message FirstSliceTraceEdge {
  string kind = 1;
  uint32 confidence = 2;
  repeated FirstSliceSourceRef source_refs = 3;
}

// One complete traced path from the source toward a reached node.
message FirstSliceTracePath {
  uint32 confidence = 1;
  repeated rootlight.common.v1.SymbolId nodes = 2;
  repeated FirstSliceTraceEdge edges = 3;
  bool cyclic = 4;
}

// Traversal boundary summary for a flow trace.
message FirstSliceTraceFrontier {
  uint32 reached_nodes = 1;
  uint32 examined_edges = 2;
  bool truncated = 3;
  uint32 unresolved_boundaries = 4;
}

// Relation projection actually used by a flow trace.
message FirstSliceTraceProjection {
  repeated string relations = 1;
  uint32 min_confidence = 2;
}

// Returns bounded directed paths and generation correlation.
message FlowTraceResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  FirstSliceQueryContext context = 2;
  repeated FirstSliceTracePath paths = 3;
  FirstSliceTraceFrontier frontier = 4;
  FirstSliceTraceProjection projection = 5;
  FirstSliceCompleteness completeness = 6;
}

// Requests bounded architecture cycle detection over a relation projection.
message ArchitectureCyclesRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.RepositoryId repository = 2;
  GenerationSelector generation = 3;
  repeated string relations = 4;
  optional uint32 min_size = 5;
  optional uint32 max_cycles = 6;
  optional bool include_self_cycles = 7;
}

// One strongly connected component containing cycles.
message FirstSliceCycleComponent {
  uint32 size = 1;
  repeated rootlight.common.v1.SymbolId members = 2;
  uint32 internal_edges = 3;
}

// One bounded representative minimal cycle with evidence.
message FirstSliceCycle {
  repeated rootlight.common.v1.SymbolId nodes = 1;
  repeated FirstSliceSourceRef edge_evidence = 2;
  uint32 confidence = 3;
}

// One candidate edge for breaking a reported cycle.
message FirstSliceCycleBreak {
  rootlight.common.v1.SymbolId from = 1;
  rootlight.common.v1.SymbolId to = 2;
  string kind = 3;
  uint32 break_cost = 4;
  repeated FirstSliceSourceRef source_refs = 5;
}

// Relation projection actually used by an architecture cycles query.
message FirstSliceCycleProjection {
  repeated string relations = 1;
  uint32 min_confidence = 2;
}

// Returns bounded architecture cycles and generation correlation.
message ArchitectureCyclesResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  FirstSliceQueryContext context = 2;
  repeated FirstSliceCycleComponent components = 3;
  repeated FirstSliceCycle cycles = 4;
  repeated FirstSliceCycleBreak break_candidates = 5;
  FirstSliceCycleProjection projection = 6;
  FirstSliceCompleteness completeness = 7;
}

// Requests bounded dead-code reachability analysis over one generation.
message CodeDeadRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.RepositoryId repository = 2;
  GenerationSelector generation = 3;
  optional string entry_point_policy = 4;
  optional bool include_exported = 5;
  optional bool include_tests = 6;
  optional uint32 min_confidence = 7;
  optional uint32 max_candidates = 8;
}

// One dead-code candidate with classification and source-free evidence.
message FirstSliceDeadCandidate {
  rootlight.common.v1.SymbolId symbol_id = 1;
  string classification = 2;
  uint32 confidence = 3;
  repeated string why = 4;
  repeated string suppressions_checked = 5;
  repeated FirstSliceSourceRef source_refs = 6;
}

// Summary of the entry-point model used for reachability.
message FirstSliceEntryPointSummary {
  string policy = 1;
  uint32 entry_point_count = 2;
  bool complete = 3;
}

// One known blind spot in the reachability analysis.
message FirstSliceBlindSpot {
  string category = 1;
  uint32 affected_count = 2;
}

// One applied false-positive suppression rule.
message FirstSliceSuppressionRule {
  string rule = 1;
  uint32 suppressed_count = 2;
}

// Returns bounded dead-code candidates and generation correlation.
message CodeDeadResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  FirstSliceQueryContext context = 2;
  repeated FirstSliceDeadCandidate candidates = 3;
  FirstSliceEntryPointSummary entry_points = 4;
  repeated FirstSliceBlindSpot blind_spots = 5;
  repeated FirstSliceSuppressionRule false_positive_controls = 6;
  FirstSliceCompleteness completeness = 7;
}

// Requests a bounded file-granularity architecture overview over one generation.
message ArchitectureOverviewRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.RepositoryId repository = 2;
  GenerationSelector generation = 3;
  repeated string views = 4;
  optional uint32 max_components = 5;
  optional bool include_edges = 6;
  optional uint32 min_confidence = 7;
}

// One aggregated architecture component keyed by its containing file.
message FirstSliceArchitectureComponent {
  string id = 1;
  string kind = 2;
  string name = 3;
  uint32 symbol_count = 4;
  repeated string responsibility_evidence = 5;
  uint32 confidence = 6;
}

// One aggregated typed connection between two architecture components.
message FirstSliceArchitectureConnection {
  string from = 1;
  string to = 2;
  string kind = 3;
  uint32 weight = 4;
  uint32 confidence = 5;
}

// One structural hotspot ranking entry for a component.
message FirstSliceHotspot {
  string component_id = 1;
  uint32 fan_in = 2;
  uint32 fan_out = 3;
  optional uint32 change_frequency = 4;
  optional uint32 complexity = 5;
  uint32 score = 6;
}

// One deterministic structural-affinity community over reported components.
message FirstSliceArchitectureCommunity {
  string id = 1;
  repeated string members = 2;
  uint64 internal_connection_weight = 3;
  bool ownership_truth = 4;
}

// Derived-view algorithm metadata for community or ownership algorithms.
message FirstSliceDerivedView {
  string view = 1;
  string algorithm_version = 2;
  map<string, string> parameters = 3;
}

// Returns bounded architecture components, connections, and hotspots.
message ArchitectureOverviewResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  FirstSliceQueryContext context = 2;
  repeated FirstSliceArchitectureComponent components = 3;
  repeated FirstSliceArchitectureConnection connections = 4;
  repeated FirstSliceHotspot hotspots = 5;
  repeated FirstSliceDerivedView views = 6;
  FirstSliceCompleteness completeness = 7;
  repeated FirstSliceArchitectureCommunity communities = 8;
}

// Requests a bounded test selection for one generation and seed set.
message TestsSelectRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.RepositoryId repository = 2;
  GenerationSelector generation = 3;
  repeated rootlight.common.v1.SymbolId seeds = 4;
  repeated string test_kinds = 5;
  optional uint32 max_tests = 6;
  optional bool include_commands = 7;
}

// One ranked test selected for relevance to the seed set.
message FirstSliceRankedTest {
  string test_id = 1;
  string kind = 2;
  optional string path = 3;
  uint32 score = 4;
  repeated string why = 5;
  optional uint32 estimated_cost_ms = 6;
  optional string command_hint = 7;
}

// Coverage signals actually used by a test selection.
message FirstSliceTestCoverageStrategy {
  bool direct_edges = 1;
  bool transitive_signals = 2;
  bool history_signals = 3;
  // Historical field retained for descriptor compatibility.
  bool build_target_signals = 4;
  bool file_colocation_signals = 5;
}

// One honest gap where a seed scope has no related test.
message FirstSliceTestGap {
  string scope = 1;
  string reason = 2;
}

// Returns bounded ranked tests, the coverage strategy, and honest gaps.
message TestsSelectResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  FirstSliceQueryContext context = 2;
  repeated FirstSliceRankedTest tests = 3;
  FirstSliceTestCoverageStrategy coverage_strategy = 4;
  repeated FirstSliceTestGap gaps = 5;
  FirstSliceCompleteness completeness = 6;
}

// Requests a bounded change-impact analysis for one generation and change set.
message ChangeImpactRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.RepositoryId repository = 2;
  GenerationSelector generation = 3;
  repeated rootlight.common.v1.SymbolId changed_symbols = 4;
  repeated string changed_paths = 5;
  optional uint32 max_depth = 6;
  optional uint32 min_confidence = 7;
  optional bool include_tests = 8;
  optional uint32 max_dependents = 9;
}

// One resolved change from the input change set.
message FirstSliceResolvedChange {
  optional rootlight.common.v1.SymbolId symbol_id = 1;
  optional rootlight.common.v1.FileId file_id = 2;
  string classification = 3;
  optional string kind = 4;
}

// One impacted dependent with path rationale.
message FirstSliceImpactEntry {
  rootlight.common.v1.SymbolId symbol_id = 1;
  string kind = 2;
  uint32 distance = 3;
  uint32 confidence = 4;
  repeated string via = 5;
  bool is_public = 6;
}

// One grouped set of impacted dependents for a resolved change.
message FirstSliceImpactGroup {
  uint32 source_index = 1;
  repeated FirstSliceImpactEntry dependents = 2;
}

// One test candidate relevant to the change.
message FirstSliceChangeImpactTest {
  string test_id = 1;
  uint32 relevance = 2;
  repeated string why = 3;
  optional uint32 estimated_cost_ms = 4;
}

// Aggregate risk summary for a change-impact result.
message FirstSliceImpactRiskSummary {
  string level = 1;
  repeated string reasons = 2;
  string coverage = 3;
  bool breaking_surface = 4;
  uint32 fanout = 5;
  bool dynamic_blind_spots = 6;
}

// Returns bounded resolved changes, impact groups, tests, and a risk summary.
message ChangeImpactResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  FirstSliceQueryContext context = 2;
  repeated FirstSliceResolvedChange resolved_changes = 3;
  repeated FirstSliceImpactGroup impacted = 4;
  repeated FirstSliceChangeImpactTest tests = 5;
  FirstSliceImpactRiskSummary risk_summary = 6;
  FirstSliceCompleteness completeness = 7;
}

// Requests a bounded ordered change plan for one generation and target set.
message PlanChangeRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.RepositoryId repository = 2;
  GenerationSelector generation = 3;
  string objective = 4;
  string objective_text = 5;
  repeated rootlight.common.v1.SymbolId target_symbols = 6;
  repeated rootlight.common.v1.FileId target_files = 7;
  optional uint32 max_steps = 8;
}

// One ordered step in a change plan.
message FirstSliceChangePlanStep {
  uint32 step = 1;
  string action = 2;
  repeated rootlight.common.v1.SymbolId targets = 3;
  repeated uint32 depends_on = 4;
  repeated string risks = 5;
  optional string verification = 6;
}

// Compact impact and ownership summary for a change plan.
message FirstSlicePlanImpactSummary {
  uint32 affected_symbols = 1;
  uint32 affected_files = 2;
  string risk_level = 3;
  bool touches_public_surface = 4;
}

// One open decision that cannot be safely inferred.
message FirstSlicePlanDecision {
  string question = 1;
  string recommended_default = 2;
}

// Ready follow-up context-pack arguments for a change plan.
message FirstSliceContextPackRequest {
  repeated rootlight.common.v1.SymbolId symbols = 1;
  repeated rootlight.common.v1.FileId files = 2;
}

// Returns bounded ordered steps, an impact summary, a test plan, decisions, and
// a ready context-pack request.
message PlanChangeResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  FirstSliceQueryContext context = 2;
  repeated FirstSliceChangePlanStep plan = 3;
  FirstSlicePlanImpactSummary affected_scope = 4;
  repeated FirstSliceChangeImpactTest test_plan = 5;
  repeated FirstSlicePlanDecision open_decisions = 6;
  FirstSliceContextPackRequest context_pack_request = 7;
  FirstSliceCompleteness completeness = 8;
}

// Selects a revision by Git ref expression or immutable generation identity.
message FirstSliceRevisionSelector {
  oneof selector {
    string git = 1;
    rootlight.common.v1.GenerationId generation = 2;
  }
}

// Requests a bounded semantic comparison between two revisions or generations.
message HistoryCompareRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.RepositoryId repository = 2;
  FirstSliceRevisionSelector base = 3;
  FirstSliceRevisionSelector head = 4;
  repeated string change_kinds = 5;
  optional uint32 max_results = 6;
}

// Resolved state pair for the comparison.
message FirstSliceMatchedStates {
  rootlight.common.v1.GenerationId base_generation = 1;
  rootlight.common.v1.GenerationId head_generation = 2;
  string coverage = 3;
}

// One semantic change between revisions.
message FirstSliceSemanticChange {
  string kind = 1;
  rootlight.common.v1.SymbolId symbol_id = 2;
  string entity_kind = 3;
  bool breaking_candidate = 4;
  uint32 significance = 5;
}

// Aggregate architecture delta between revisions.
message FirstSliceArchitectureDelta {
  uint32 new_cross_service_edges = 1;
  uint32 removed_cross_service_edges = 2;
  uint32 new_boundaries = 3;
  uint32 removed_boundaries = 4;
}

// One breaking-change candidate with consumer evidence.
message FirstSliceBreakingCandidate {
  rootlight.common.v1.SymbolId symbol_id = 1;
  uint32 consumer_count = 2;
  bool is_public_surface = 3;
  string reason = 4;
}

// One lineage match between base and head entities.
message FirstSliceLineageMatch {
  rootlight.common.v1.SymbolId base_symbol_id = 1;
  rootlight.common.v1.SymbolId head_symbol_id = 2;
  uint32 confidence = 3;
  bool is_rename = 4;
}

// Returns bounded semantic changes, an architecture delta, breaking candidates,
// and lineage matches for the resolved state pair.
message HistoryCompareResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  FirstSliceQueryContext context = 2;
  FirstSliceMatchedStates matched_states = 3;
  repeated FirstSliceSemanticChange changes = 4;
  FirstSliceArchitectureDelta architecture_delta = 5;
  repeated FirstSliceBreakingCandidate breaking_candidates = 6;
  repeated FirstSliceLineageMatch lineage = 7;
  FirstSliceCompleteness completeness = 8;
}

// Requests a bounded advanced query over a safe typed AST.
//
// The query is a JSON-encoded declarative AST: a bounded, allow-listed operator
// tree. SQL strings, Cypher text, shell fragments, arbitrary regex, arbitrary
// code, and unbounded recursion are forbidden by the AST grammar and rejected
// before execution.
message AdvancedQueryRequest {
  rootlight.common.v1.ContractVersion schema_version = 1;
  rootlight.common.v1.RepositoryId repository = 2;
  GenerationSelector generation = 3;
  string query_ast = 4;
  optional bool explain = 5;
  optional uint32 max_results = 6;
  optional uint32 max_depth = 7;
  optional uint64 cost_limit = 8;
  uint64 page_offset = 9;
}

// One typed column definition in an advanced query result schema.
message FirstSliceAdvancedColumn {
  string name = 1;
  string column_type = 2;
}

// Operators, estimates, and applied limits for an advanced query plan.
message FirstSliceAdvancedPlan {
  uint64 estimated_cost = 1;
  repeated string operators = 2;
  repeated string applied_limits = 3;
}

// Returns typed columns, JSON-encoded rows, an optional plan, and an honest
// completeness classification for a bounded advanced query.
message AdvancedQueryResponse {
  rootlight.common.v1.ContractVersion schema_version = 1;
  FirstSliceQueryContext context = 2;
  repeated FirstSliceAdvancedColumn columns = 3;
  repeated string rows = 4;
  FirstSliceAdvancedPlan plan = 5;
  string completeness = 6;
  optional uint64 next_page_offset = 7;
  FirstSliceCompleteness result_completeness = 8;
}
