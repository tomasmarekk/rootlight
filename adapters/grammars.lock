license_sha256 = "dec735ccc031754dd05e6556dd9e959915eb367cf01cf009c77a1a38786932b1"
modifications = "local static Rust binding, translation-unit constant buffer with optional written register annotation and semicolon, and narrow scanner callback safety repair; six authentic twin outputs and complete published HLSL, authored HLSL, C++ and C originals retained; see PATCHES.md"
test_corpus = "unchanged seven native groups and nine source observations pass current Rust 1.97.1 and minimum 1.90.0, including the relocated package; SDK, query and installed MCP are separate qualifications"
msrv = "1.90"
offline_behavior = "retained ABI14 C table, preferred scanner and exact local Rust inputs; no source acquisition, grammar evaluation, submodule initialization or archived package lifecycle during compilation"
capabilities = ["source-declarations", "source-containment", "comments", "scoped-coverage-gaps"]
semantic_depth = "physical written syntax and raw annotations only; a constant-buffer name is not a declaration scope or resolved identity; shader-profile validity, preprocessor selection, register or space assignment, runtime binding and inherited permissive local-buffer syntax remain unqualified"
audit_notes = ["complete originals retain four raw archives, 212 original files and 65 archive directory records with mode and executable intent; revision association is not signed provenance", "HLSL, exact authored C++ e5cea0ec884c5c3d2d1e41a741a66ce13da4d945 and C 2a265d69a4caf57108a73ad2ed1e6922dd2f998c retain all three MIT notices; a different registry revision is not substituted", "two ABI14 CLI 0.26.8 and Node 24.11.1 producers yielded six literal-identical outputs and passed both table-width guards", "preferred scanner callbacks recorded 16 accepted and five rejected lengths plus null and private allocation-failure cases; two inherited compiler warnings remain disclosed; the unsafe original scanner is retained inert and received no malformed-state execution", "published provenance preserves the isolated native proof; a later independently recorded relocated proof conserves the same fixture and source bytes", "fixture-scoped syntax evidence is not SDK or MCP binding, whole-language coverage, indexing speed, complete product source closure or independently network-denied empty-cache build acceptance"]

