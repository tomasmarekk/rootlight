[workspace]
members = [
    "apps/rootlight",
    "apps/rootlight-adapter-host",
    "apps/rootlight-daemon",
    "apps/rootlight-launcher",
    "apps/rootlight-mcp",
    "apps/rootlight-semantic-host",
    "apps/rootlight-web",
    "crates/rootlight-adapter-sdk",
    "crates/rootlight-adapter-treesitter",
    "crates/rootlight-adapters",
    "crates/rootlight-agent",
    "crates/rootlight-bench",
    "crates/rootlight-build",
    "crates/rootlight-cancel",
    "crates/rootlight-catalog",
    "crates/rootlight-client",
    "crates/rootlight-config",
    "crates/rootlight-daemon-core",
    "crates/rootlight-error",
    "crates/rootlight-git",
    "crates/rootlight-ids",
    "crates/rootlight-ipc",
    "crates/rootlight-ir",
    "crates/rootlight-incremental",
    "crates/rootlight-discovery",
    "crates/rootlight-mcp-contract",
    "crates/rootlight-observability",
    "crates/rootlight-operations",
    "crates/rootlight-protocol",
    "crates/rootlight-query",
    "crates/rootlight-resolve",
    "crates/rootlight-runtime",
    "crates/rootlight-sandbox",
    "crates/rootlight-search",
    "crates/rootlight-semantic",
    "crates/rootlight-segment",
    "crates/rootlight-service",
    "crates/rootlight-source",
    "crates/rootlight-storage",
    "crates/rootlight-vfs",
    "crates/rootlight-workspace",
    "xtask",
]
exclude = [
    "tests/fixtures/architecture/forbidden-edge",
    "third_party/lru-0.16.4",
    "third_party/tree-sitter-bash-0.25.1",
    "third_party/tree-sitter-css-0.25.0",
    "third_party/tree-sitter-html-0.23.2",
    "third_party/tree-sitter-json-0.24.8",
    "third_party/tree-sitter-r-1.3.0",
    "third_party/tree-sitter-sequel-0.3.11",
    "third_party/tree-sitter-swift-0.7.3",
    "third_party/tree-sitter-toml-ng-0.7.0",
    "third_party/tree-sitter-yaml-0.7.2",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
repository = "https://github.com/tomasmarekk/rootlight"
license = "AGPL-3.0-only"

[workspace.dependencies]
anyhow = { version = "1.0.103", default-features = false, features = ["std"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
blake3 = { version = "1.8.5", default-features = false, features = ["pure", "std"] }
cap-fs-ext = { version = "3.4.5", default-features = false, features = ["std"] }
cap-std = { version = "3.4.5", default-features = false }
cargo_metadata = { version = "0.23.1", default-features = false }
data-encoding = { version = "2.9.0", default-features = false, features = ["std"] }
directories = { version = "6.0.0", default-features = false }
ed25519-compact = { version = "=2.3.1", default-features = false }
form_urlencoded = { version = "1.2.2", default-features = false, features = ["alloc"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
fs2 = { version = "=0.4.3", default-features = false }
getrandom = { version = "0.3.4", default-features = false }
ignore = { version = "0.4.29", default-features = false }
interprocess = { version = "=2.2.3", default-features = false, features = ["tokio"] }
jsonschema = { version = "0.47.0", default-features = false }
landlock = { version = "=0.4.7", default-features = false }
libc = { version = "=0.2.186", default-features = false }
mime_guess = { version = "=2.0.5", default-features = false }
nix = { version = "0.31.3", default-features = false, features = ["fs", "socket", "user"] }
nt-token = { version = "=0.5.0", default-features = false }
proptest = { version = "1.9.0", default-features = false, features = ["std"] }
prost = { version = "0.14.4", default-features = false, features = ["derive", "std"] }
prost-build = { version = "0.14.4", default-features = false, features = ["format"] }
prost-types = { version = "0.14.4", default-features = false, features = ["std"] }
protoc-bin-vendored = { version = "3.2.0", default-features = false }
protobuf = { version = "=3.7.2", default-features = false }
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled", "column_decltype", "hooks", "limits", "modern_sqlite"] }
rmp-serde = "=1.3.1"
rustix = { version = "=1.1.4", default-features = false, features = ["fs", "process", "std"] }
schemars = { version = "1.2.1", default-features = false, features = ["derive", "std"] }
scip = { version = "=0.9.0" }
seccompiler = { version = "=0.5.0", default-features = false }
semver = { version = "1.0.28", default-features = false, features = ["std"] }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.150", default-features = false, features = ["std"] }
sha2 = { version = "0.11.0", default-features = false }
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing", "visit"] }
sysinfo = { version = "=0.37.2", default-features = false, features = ["system"] }
subtle = { version = "=2.6.1", default-features = false, features = ["std"] }
tantivy = { version = "=0.26.1", default-features = false, features = ["mmap"] }
tantivy-fst = { version = "=0.5.0", default-features = false }
tempfile = "3.23.0"
thiserror = { version = "2.0.18", default-features = false, features = ["std"] }
tiktoken-rs = { version = "=0.12.0", default-features = false }
tree-sitter = { version = "=0.26.11", default-features = false, features = ["std"] }
tree-sitter-bash = { version = "=0.25.1", default-features = false }
tree-sitter-json = { version = "=0.24.8", default-features = false }
tree-sitter-html = { version = "=0.23.2", default-features = false }
tree-sitter-sequel = { version = "=0.3.11", default-features = false }
tree-sitter-r = { version = "=1.3.0", default-features = false }
tree-sitter-toml-ng = { version = "=0.7.0", default-features = false }
tree-sitter-yaml = { version = "=0.7.2", default-features = false }
tree-sitter-c = { version = "=0.24.2", default-features = false }
tree-sitter-c-sharp = { version = "=0.23.5", default-features = false }
tree-sitter-cpp = { version = "=0.23.4", default-features = false }
tree-sitter-css = { version = "=0.25.0", default-features = false }
tree-sitter-go = { version = "=0.25.0", default-features = false }
tree-sitter-java = { version = "=0.23.5", default-features = false }
tree-sitter-kotlin-ng = { version = "=1.1.0", default-features = false }
tree-sitter-lua = { version = "=0.5.0", default-features = false }
tree-sitter-php = { version = "=0.24.2", default-features = false }
tree-sitter-python = { version = "=0.25.0", default-features = false }
tree-sitter-ruby = { version = "=0.23.1", default-features = false }
tree-sitter-rust = { version = "=0.24.2", default-features = false }
tree-sitter-swift = { version = "=0.7.3", default-features = false }
tree-sitter-typescript = { version = "=0.23.2", default-features = false }
tokio = { version = "=1.48.0", default-features = false, features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = { version = "1.1.3", default-features = false, features = ["parse", "serde", "std"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
unicode-casefold = { version = "=0.2.0", default-features = false }
unicode-general-category = { version = "=1.1.0", default-features = false }
unicode-normalization = { version = "=0.1.25", default-features = false, features = ["std"] }
widestring = { version = "1.2.1", default-features = false, features = ["std"] }
windows = { version = "=0.61.3", default-features = false, features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading"] }
windows-permissions = { version = "=0.2.4", default-features = false }
winx = { version = "=0.36.4", default-features = false }
winapi-util = { version = "=0.1.11", default-features = false }
yaml-rust2 = { version = "0.10.4", default-features = false }
zip = { version = "=2.4.2", default-features = false }

[patch.crates-io]
tree-sitter-bash = { path = "third_party/tree-sitter-bash-0.25.1" }
tree-sitter-json = { path = "third_party/tree-sitter-json-0.24.8" }
tree-sitter-html = { path = "third_party/tree-sitter-html-0.23.2" }
tree-sitter-sequel = { path = "third_party/tree-sitter-sequel-0.3.11" }
tree-sitter-r = { path = "third_party/tree-sitter-r-1.3.0" }
tree-sitter-toml-ng = { path = "third_party/tree-sitter-toml-ng-0.7.0" }
tree-sitter-yaml = { path = "third_party/tree-sitter-yaml-0.7.2" }
lru = { path = "third_party/lru-0.16.4" }
tree-sitter-css = { path = "third_party/tree-sitter-css-0.25.0" }
tree-sitter-swift = { path = "third_party/tree-sitter-swift-0.7.3" }

# Debug daemons hash large executables inside the bounded support-bundle request.
[profile.dev.package.sha2]
opt-level = 3

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
