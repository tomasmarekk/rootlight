tree-sitter-yaml = { path = "third_party/tree-sitter-yaml-0.7.2" }
lru = { path = "crates/lru" }
tree-sitter-css = { path = "third_party/tree-sitter-css-0.25.0" }
tree-sitter-swift = { path = "third_party/tree-sitter-swift-0.7.3" }
tree-sitter-typescript = { path = "third_party/tree-sitter-typescript-0.23.2" }

# Debug daemons hash large executables inside the bounded support-bundle request.
[profile.dev.package.rootlight-crypto]
opt-level = 3

# Adapter authentication hashes large executables under the sandbox CPU grant.
# Keep the portable implementation optimized in debug tests without relaxing limits.
[profile.dev.package.blake3]
opt-level = 3

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"
unreachable_pub = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
